modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Swan & les potes"
description='''
Le mod maison du serveur : téléphones avec numéros perso (Simple Voice Chat),
centre de map avec la cabane abandonnée, reliques cachées dans les donjons.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="voicechat"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"

# Curios : les slots accessoires (queue de Saiyan, détecteurs…), fourni par le pack ; sans lui, ces objets ne se portent pas
[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    versionRange="[9.5,)"
    ordering="NONE"
    side="BOTH"

[[mixins]]
config="cabane.mixins.json"
