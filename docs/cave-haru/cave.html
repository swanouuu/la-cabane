<style>

<div class="panneau" id="p-couche"><h2>Couche <span id="pc-y"></span></h2><div id="pc-info"></div><canvas id="carte"></canvas><div style="color:#a68a64;font-size:12px">↓ côté rue (devant) · chaque case = 1 bloc · le trait clair d'un escalier = son côté haut</div><table id="pc-liste"></table></div>

<div id="bulle"></div>
<script type="module">
// Croquis de « La Cave à Haru » : un bar 20 × 10 façon vieille cave à vin (rez-de-chaussée), une cave voûtée en
// dessous avec deux fûts géants dont un cache une porte vers la salle secrète d'Haru. Chaque bloc est posé dans une
// grille (pose), puis affiché en cubes ; les affiches sont dessinées à partir du skin d'Haru (skin-haru.png).
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ---------------------------------------------------------------- les blocs
const T = {
  pierre:   { nom: 'Pierres taillées', c: '#7f7f7f', m: 'briques' },
  pierre_m: { nom: 'Pierres taillées moussues', c: '#727a68', m: 'briques', mousse: true },
  pierre_f: { nom: 'Pierres taillées fissurées', c: '#787878', m: 'briques', fissure: true },
  pave:     { nom: 'Pierre (pavés)', c: '#6c6c6c', m: 'pave' },
  pave_m:   { nom: 'Pavés moussus', c: '#5f6a58', m: 'pave', mousse: true },
  buche:    { nom: 'Bûche de chêne noir', c: '#3e2c1c', m: 'buche', axe: true },
  cn_pl:    { nom: 'Planches de chêne noir', c: '#4b3321', m: 'planches' },
  cn_dalle: { nom: 'Dalle de chêne noir', c: '#4b3321', m: 'planches' },
  cn_esc:   { nom: 'Escalier en chêne noir', c: '#4b3321', m: 'planches' },
  ep_pl:    { nom: "Planches d'épicéa", c: '#71502e', m: 'planches' },
  ep_dalle: { nom: "Dalle d'épicéa (tabouret)", c: '#71502e', m: 'planches' },
  ep_esc:   { nom: "Escalier en épicéa", c: '#71502e', m: 'planches' },
  ep_ec:    { nom: "Bois d'épicéa écorcé", c: '#8d6943', m: 'ecorce' },
  tuile_esc:   { nom: "Escalier en tuiles d'ardoise des abîmes", c: '#38383e', m: 'tuiles' },
  tuile_dalle: { nom: "Dalle de tuiles d'ardoise des abîmes", c: '#38383e', m: 'tuiles' },
  briques:  { nom: 'Briques', c: '#94503a', m: 'briques_rouges' },
  ardoise:  { nom: 'Ardoise des abîmes polie', c: '#4a4a50', m: 'lisse' },
  tonneau:  { nom: 'Tonneau', c: '#6d4b2c', m: 'tonneau', axe: true },
  vitre:    { nom: 'Vitre', c: '#a9d3e4', m: 'verre', transp: 0.35 },
  lanterne: { nom: 'Lanterne', c: '#ffb347', m: 'lanterne', lum: 1.6 },
  bougie:   { nom: 'Bougies', c: '#efe0bd', m: 'bougie', lum: 0.9 },
  chaine:   { nom: 'Chaîne', c: '#3b3f48', m: 'lisse' },
  feu:      { nom: 'Feu de camp', c: '#ff7a1a', m: 'feu', lum: 1.4 },
  porte:    { nom: 'Porte en chêne noir', c: '#40291a', m: 'porte' },
  porte_s:  { nom: "Porte camouflée (FramedBlocks, en bois d'épicéa écorcé)", c: '#8d6943', m: 'ecorce' },
  barriere: { nom: 'Barrière en chêne noir', c: '#40291a', m: 'planches' },
  plaque:   { nom: 'Plaque de pression en chêne noir', c: '#4b3321', m: 'planches' },
  tapis:    { nom: 'Tapis rouge', c: '#9c2828', m: 'laine' },
  casier:   { nom: 'Casier à bouteilles (étagère + bouteilles)', c: '#3d2818', m: 'casier' },
  cuivre:   { nom: 'Cuivre taillé', c: '#c56f46', m: 'cuivre' },
  tuyau:    { nom: 'Paratonnerre (tuyau en cuivre)', c: '#cd7d54', m: 'lisse' },
  chaudron: { nom: 'Chaudron', c: '#3b3b40', m: 'chaudron' },
  robinet:  { nom: 'Robinet (Supplementaries)', c: '#9097a0', m: 'lisse' },
  coffre:   { nom: 'Coffre', c: '#8f5d2c', m: 'coffre' },
  or:       { nom: "Bloc d'or", c: '#f0c22f', m: 'or' },
  toile:    { nom: "Toile d'araignée", c: '#e8e8e8', m: 'toile', transp: 0.6 },
  foin:     { nom: 'Botte de foin (le houblon)', c: '#c7a33a', m: 'foin', axe: true },
  chope:    { nom: 'Chope posée (déco)', c: '#e2a332', m: 'chope' },
  bouteille:{ nom: 'Bouteille posée (déco)', c: '#2f6b3a', m: 'bouteille' },
  noir_br:  { nom: 'Briques de roche noire polie', c: '#2e2a30', m: 'briques' },
  dore:     { nom: 'Roche noire dorée', c: '#5a4a2a', m: 'dore' },
  quartz:   { nom: 'Bloc de quartz', c: '#ebe5dc', m: 'lisse' },
  quartz_p: { nom: 'Pilier de quartz', c: '#e6dfd4', m: 'buche_q' },
  fer:      { nom: 'Bloc de fer', c: '#d8d8d8', m: 'or' },
  diamant:  { nom: 'Bloc de diamant', c: '#5fe0d8', m: 'or' },
  emeraude: { nom: "Bloc d'émeraude", c: '#3ccf6a', m: 'or' },
  or_brut:  { nom: "Bloc d'or brut", c: '#d9a62a', m: 'pave' },
  echelle:  { nom: 'Échelle', c: '#8a6a3c', m: 'echelle', transp: 0.5 },
};

// formes : morceaux [x, y, z, largeur, hauteur, profondeur] dans le bloc
function morceaux(f, d) {
  switch (f) {
    case 'dalle': return [[0, 0, 0, 1, .5, 1]];
    case 'dalle_h': return [[0, .5, 0, 1, .5, 1]];
    case 'esc': {
      const haut = { n: [0, .5, 0, 1, .5, .5], s: [0, .5, .5, 1, .5, .5], e: [.5, .5, 0, .5, .5, 1], w: [0, .5, 0, .5, .5, 1] }[d];
      return [[0, 0, 0, 1, .5, 1], haut];
    }
    case 'poteau': return [[.375, 0, .375, .25, 1, .25]];
    case 'plaque': return [[.0625, 0, .0625, .875, .0625, .875]];
    case 'tapis': return [[0, 0, 0, 1, .0625, 1]];
    case 'petit': return [[.31, 0, .31, .38, .46, .38], [.37, .46, .37, .26, .1, .26]];
    case 'petit_h': return [[.31, .32, .31, .38, .46, .38], [.45, .78, .45, .1, .22, .1]];
    case 'bougies': return [[.2, 0, .25, .14, .42, .14], [.56, 0, .32, .14, .3, .14], [.36, 0, .6, .14, .52, .14]];
    case 'chaine': return [[.45, 0, .45, .1, 1, .1]];
    case 'vitre': return d === 'x' ? [[0, 0, .44, 1, 1, .12]] : [[.44, 0, 0, .12, 1, 1]];
    case 'porte': return d === 'n' || d === 's' ? [[0, 0, .41, 1, 1, .18]] : [[.41, 0, 0, .18, 1, 1]];
    case 'feu': return [[0, 0, 0, 1, .44, 1]];
    case 'robinet': return d === 'n' ? [[.38, .35, .5, .24, .28, .5], [.42, .17, .52, .16, .2, .16]] : [[.38, .35, 0, .24, .28, .5], [.42, .17, .32, .16, .2, .16]];
    case 'echelle': return { n: [[0, 0, .9, 1, 1, .1]], s: [[0, 0, 0, 1, 1, .1]], e: [[0, 0, 0, .1, 1, 1]], w: [[.9, 0, 0, .1, 1, 1]] }[d];
    case 'tuyau': return d === 'x' ? [[0, .4, .4, 1, .2, .2]] : d === 'z' ? [[.4, .4, 0, .2, .2, 1]] : [[.4, 0, .4, .2, 1, .2]];
    case 'coffre': return [[.06, 0, .06, .88, .88, .88]];
    case 'toile': return [[.05, .05, .47, .9, .9, .06], [.47, .05, .05, .06, .9, .9]];
    case 'chope': return [[.36, 0, .36, .28, .36, .28]];
    case 'chope_d': return [[.36, .5, .36, .28, .36, .28]];
    case 'bouteille_d': return [[.42, .5, .42, .16, .46, .16], [.46, .96, .46, .08, .04, .08]];
    default: return [[0, 0, 0, 1, 1, 1]];
  }
}

const MAP = new Map();
const DECO = [];
const cle = (x, y, z) => x + ',' + y + ',' + z;
function pose(x, y, z, t, f = 'cube', d = null, plafond = false, e = null) { MAP.set(cle(x, y, z), { x, y, z, t, f, d, plafond, e }); }
const AFFS = [];
function affiche(nom, x, y, z, face) { AFFS.push({ nom, x, y, z, face }); }
let HARU = null;
function haru(x, y, z, yaw) { HARU = { x, y, z, yaw }; }
function remplir() {} // le contenu des tonneaux : seulement dans le jeu
function deco(x, y, z, t, f = 'cube', d = null) { DECO.push({ x, y, z, t, f, d }); }
function vide(x, y, z) { MAP.delete(cle(x, y, z)); }
function h3(x, y, z) { const n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return n - Math.floor(n); }
function pierreMix(x, y, z, mousse) { const r = h3(x, y, z); return r < mousse ? 'pierre_m' : r < mousse + 0.13 ? 'pierre_f' : 'pierre'; }

// ================================================================ PLAN : début (outils/cave-haru.mjs rejoue tout ce bloc)
// Repère du plan : x 0..19 le long de la façade, z 0..9 vers le fond (la rue est côté z négatif), y 0 = sol du bar
// (un bloc au-dessus du sol dehors). affiche(nom, x0, y0, z0, face) : les cases que l'affiche couvre, côté pièce.

// ---------------------------------------------------------------- le rez-de-chaussée (le bar)
for (let x = 0; x <= 19; x++) for (let z = 0; z <= 9; z++) {
  const bord = x === 0 || x === 19 || z === 0 || z === 9;
  pose(x, 0, z, bord ? 'pave' : 'ep_pl');
  if (bord) for (let y = 1; y <= 5; y++) pose(x, y, z, pierreMix(x, y, z, 0.1));
}
for (const px of [0, 6, 13, 19]) for (let y = 0; y <= 5; y++) { pose(px, y, 0, 'buche', 'cube', 'y'); pose(px, y, 9, 'buche', 'cube', 'y'); }
for (let x = 0; x <= 19; x++) { pose(x, 5, 0, 'buche', 'cube', 'x'); pose(x, 5, 9, 'buche', 'cube', 'x'); }
for (let z = 1; z <= 8; z++) { pose(0, 5, z, 'buche', 'cube', 'z'); pose(19, 5, z, 'buche', 'cube', 'z'); }
for (const px of [6, 13]) for (let z = 1; z <= 8; z++) pose(px, 5, z, 'buche', 'cube', 'z'); // poutres du plafond
// fenêtres
for (const x of [2, 3, 16, 17]) for (const y of [2, 3]) pose(x, y, 0, 'vitre', 'vitre', 'x');
for (const x of [1, 2, 3, 4, 15, 16, 17, 18]) pose(x, 4, 0, 'buche', 'cube', 'x');
for (const z of [3, 4]) for (const y of [2, 3]) pose(19, y, z, 'vitre', 'vitre', 'z');
// porte + linteau + marches
pose(9, 1, 0, 'porte', 'porte', 'n', false, 'bas_g'); pose(9, 2, 0, 'porte', 'porte', 'n', false, 'haut_g');
pose(10, 1, 0, 'porte', 'porte', 'n', false, 'bas_d'); pose(10, 2, 0, 'porte', 'porte', 'n', false, 'haut_d');
for (const x of [9, 10]) pose(x, 0, -1, 'ep_esc', 'esc', 's');
for (let x = 8; x <= 11; x++) pose(x, 3, 0, 'buche', 'cube', 'x');
affiche('enseigne', 7, 4, -1, 'n'); // 6 × 2, d'un poteau à l'autre, centrée sur la porte
// fûts dehors
pose(6, 0, -1, 'tonneau', 'cube', 'y'); pose(6, 1, -1, 'lanterne', 'petit');
pose(13, 0, -1, 'tonneau', 'cube', 'y'); pose(13, 1, -1, 'tonneau', 'cube', 'y'); pose(13, 2, -1, 'lanterne', 'petit');
// plafond
for (let x = 0; x <= 19; x++) for (let z = 0; z <= 9; z++) pose(x, 6, z, 'cn_pl');
// cheminée
for (let y = 1; y <= 5; y++) { pose(1, y, 3, 'briques'); pose(1, y, 6, 'briques'); pose(0, y, 4, 'briques'); pose(0, y, 5, 'briques'); }
for (let y = 3; y <= 5; y++) { pose(1, y, 4, 'briques'); pose(1, y, 5, 'briques'); }
pose(1, 1, 4, 'feu', 'feu', 'e'); pose(1, 1, 5, 'feu', 'feu', 'e');
for (let z = 3; z <= 6; z++) pose(2, 3, z, 'cn_dalle', 'dalle_h');
pose(2, 4, 3, 'bougie', 'bougies'); pose(2, 4, 6, 'bougie', 'bougies');
affiche('cave', 2, 4, 4, 'e');
// escalier vers la cave (descend vers l'est)
for (let k = 0; k <= 5; k++) for (const z of [7, 8]) pose(2 + k, -k, z, 'ep_esc', 'esc', 'w');
for (let x = 3; x <= 7; x++) for (const z of [7, 8]) vide(x, 0, z);
for (let x = 2; x <= 7; x++) pose(x, 1, 6, 'barriere', 'poteau');
for (const z of [7, 8]) pose(8, 1, z, 'barriere', 'poteau');
// comptoir en fûts
for (let x = 11; x <= 17; x++) { pose(x, 1, 5, 'tonneau', 'cube', 'z'); pose(x, 2, 5, 'cn_dalle', 'dalle'); }
for (let z = 6; z <= 8; z++) { pose(11, 1, z, 'tonneau', 'cube', 'x'); pose(11, 2, z, 'cn_dalle', 'dalle'); }
deco(12, 2, 5, 'chope', 'chope_d'); deco(15, 2, 5, 'chope', 'chope_d'); deco(11, 2, 7, 'chope', 'chope_d');
for (const x of [12, 14, 16]) pose(x, 1, 4, 'ep_dalle', 'dalle');
// râtelier à fûts derrière le comptoir, l'affiche au-dessus
// une boisson par colonne, 16 bouteilles par tonneau
const RATELIER = ['biere_blonde', 'biere_brune', 'biere_86', 'vin_rouge', 'pastis', 'rhum', 'biere_blonde'];
for (let x = 12; x <= 18; x++) for (let y = 1; y <= 3; y++) { pose(x, y, 8, 'tonneau', 'cube', 'z'); remplir(x, y, 8, 'cabane:' + RATELIER[x - 12], 16); }
for (const x of [12, 13]) { pose(x, 4, 8, 'cn_dalle', 'dalle'); deco(x, 4, 8, 'bouteille', 'bouteille_d'); }
affiche('carte', 17, 4, 8, 'n');
for (const x of [13, 15, 17]) pose(x, 2, 7, 'robinet', 'robinet', 'n');
affiche('happy', 14, 4, 8, 'n');
// une estrade derrière le comptoir : celui qui sert dépasse du comptoir
for (let x = 12; x <= 18; x++) for (const z of [6, 7]) pose(x, 1, z, 'ep_dalle', 'dalle');
// tables
function table(x, z) { pose(x, 1, z, 'barriere', 'poteau'); pose(x, 2, z, 'plaque', 'plaque'); }
table(3, 2); pose(2, 1, 2, 'cn_esc', 'esc', 'w'); pose(4, 1, 2, 'cn_esc', 'esc', 'e');
table(7, 2); pose(6, 1, 2, 'cn_esc', 'esc', 'w'); pose(8, 1, 2, 'cn_esc', 'esc', 'e');
function tableFut(x, z, tabourets) { pose(x, 1, z, 'tonneau', 'cube', 'y'); pose(x, 2, z, 'bougie', 'bougies'); for (const [tx, tz] of tabourets) pose(tx, 1, tz, 'ep_dalle', 'dalle'); }
tableFut(5, 4, [[4, 4], [6, 4], [5, 5]]);
tableFut(8, 4, [[8, 5], [8, 3]]);
tableFut(17, 2, [[16, 2], [18, 2]]);
for (const x of [9, 10]) for (let z = 1; z <= 4; z++) pose(x, 1, z, 'tapis', 'tapis');
affiche('blonde', 7, 2, 1, 's');
affiche('rousse', 11, 2, 1, 's');
affiche('wanted', 18, 2, 6, 'w');
// lanternes suspendues
for (const [x, z] of [[3, 3], [8, 5], [10, 2], [15, 3], [16, 7], [4, 7]]) { pose(x, 5, z, 'chaine', 'chaine'); pose(x, 4, z, 'lanterne', 'petit_h'); }

// ---------------------------------------------------------------- la cave

  for (const [k, liste] of paquets) {

    liste.forEach((e, i) => { p.set(e[0], e[1], e[2]); s.set(e[3], e[4], e[5]); m.compose(p, q, s); im.setMatrixAt(i, m); });

}

const CANVAS = {};
function dessinerAffiches() {
  for (const [nom, a] of Object.entries(AFFICHES)) {
    const [c, g] = toile(a.w * 192, a.h * 192);
    a.dessin(g, c.width, c.height);

}
// (x, y, z) : la case du coin bas, côté le plus petit ; face : vers où regarde l'affiche (s = +z, n = -z, e = +x, w = -x)
function accroche({ nom, x, y, z, face }) {
  const a = AFFICHES[nom], tx = new THREE.CanvasTexture(CANVAS[nom]); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 4;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(a.w, a.h), new THREE.MeshStandardMaterial({ map: tx, roughness: 0.85 }));
  const cy = y + a.h / 2;
  if (face === 's') m.position.set(x + a.w / 2, cy, z + 0.03);
  if (face === 'n') m.position.set(x + a.w / 2, cy, z + 0.97);
  if (face === 'e') m.position.set(x + 0.03, cy, z + a.w / 2);
  if (face === 'w') m.position.set(x + 0.97, cy, z + a.w / 2);
  m.rotation.y = { s: 0, n: Math.PI, e: Math.PI / 2, w: -Math.PI / 2 }[face];
  m.userData.b = { x, y, z };
  decors.push(m); scene.add(m);
}

// la statue d'Haru en cubes (même découpe que le vrai skin)
function partie(tex, w, h, d, u, v, gonfle, transp) {
  const geo = new THREE.BoxGeometry(w + gonfle, h + gonfle, d + gonfle);
  const uv = geo.attributes.uv;
  const rects = [[u + d + w, v + d, d, h], [u, v + d, d, h], [u + d, v, w, d], [u + d + w, v, w, d], [u + d, v + d, w, h], [u + 2 * d + w, v + d, w, h]];
  rects.forEach(([x0, y0, rw, rh], i) => {
    const U0 = x0 / 64, U1 = (x0 + rw) / 64, V0 = 1 - y0 / 64, V1 = 1 - (y0 + rh) / 64;
    uv.setXY(i * 4, U0, V0); uv.setXY(i * 4 + 1, U1, V0); uv.setXY(i * 4 + 2, U0, V1); uv.setXY(i * 4 + 3, U1, V1);
  });
  return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, transparent: transp, alphaTest: transp ? 0.5 : 0.1, roughness: 0.8, side: transp ? THREE.DoubleSide : THREE.FrontSide }));
}
function statueHaru() {
  const tex = new THREE.Texture(SKIN); tex.needsUpdate = true; tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.colorSpace = THREE.SRGBColorSpace;
  const g = new THREE.Group();
  const ajoute = (parent, w, h, d, u, v, ou, uo, vo, gonfle) => {
    const a = partie(tex, w, h, d, u, v, 0, false); a.position.copy(ou); parent.add(a);
    const b = partie(tex, w, h, d, uo, vo, gonfle, true); b.position.copy(ou); parent.add(b);
  };
  ajoute(g, 8, 8, 8, 0, 0, new THREE.Vector3(0, 28, 0), 32, 0, 1);
  ajoute(g, 8, 12, 4, 16, 16, new THREE.Vector3(0, 18, 0), 16, 32, 0.5);
  ajoute(g, 4, 12, 4, 0, 16, new THREE.Vector3(-2, 6, 0), 0, 32, 0.5);
  ajoute(g, 4, 12, 4, 16, 48, new THREE.Vector3(2, 6, 0), 0, 48, 0.5);
  const brasD = new THREE.Group(); brasD.position.set(-6, 22, 0); g.add(brasD);
  ajoute(brasD, 4, 12, 4, 40, 16, new THREE.Vector3(0, -4, 0), 40, 32, 0.5);
  brasD.rotation.x = -0.5; brasD.rotation.z = -0.25;
  const verre = new THREE.Group(); verre.position.set(0, -11, 1.5); verre.rotation.x = 0.5; verre.rotation.z = 0.25; brasD.add(verre);
  const corps = new THREE.Mesh(new THREE.BoxGeometry(3.4, 4.4, 3.4), new THREE.MeshStandardMaterial({ color: 0xf0a828, emissive: 0x3a2000, roughness: 0.4 }));
  corps.position.y = 1.6; verre.add(corps);
  const mousse = new THREE.Mesh(new THREE.BoxGeometry(3.6, 1.2, 3.6), new THREE.MeshStandardMaterial({ color: 0xfff4da, roughness: 0.9 }));
  mousse.position.y = 4.2; verre.add(mousse);
  const brasG = new THREE.Group(); brasG.position.set(6, 22, 0); g.add(brasG);
  ajoute(brasG, 4, 12, 4, 32, 48, new THREE.Vector3(0, -4, 0), 48, 48, 0.5);
  brasG.rotation.z = 0.08;
  g.scale.setScalar(0.94 / 16);
  g.position.set(HARU.x, HARU.y, HARU.z); g.rotation.y = HARU.yaw * Math.PI / 180;
  g.userData.b = { x: Math.floor(HARU.x), y: HARU.y, z: Math.floor(HARU.z) };
  decors.push(g); scene.add(g);
}

const REGLAGES = { dehors: { vue: 'tout', toit: true, coupe: false }, bar: { vue: 'bar', toit: false, coupe: true }, cave: { vue: 'cave', toit: true, coupe: true }, secret: { vue: 'tresor', toit: false, coupe: true } };

// couche par couche
function nomCouche(y) { return y === 0 ? 'y 0 · sol du bar' : y === -6 ? 'y −6 · sol de la cave' : y === 6 ? 'y 6 · plafond du bar' : y > 6 ? `y ${y} · toit` : y > 0 ? `y ${y} · bar` : `y ${y} · cave`; }
function majCouche() {
  const y = +$('couche').value; etat.couche = y; $('couche-val').textContent = nomCouche(y).replace('−', '-');
  construire(); dessinerCouche(y);
}
function finCouche() { etat.couche = null; $('couche').disabled = true; $('p-couche').style.display = 'none'; $('couche-val').textContent = ''; construire(); }
$('couche-on').onchange = (e) => {
  if (e.target.checked) { $('couche').disabled = false; $('p-couche').style.display = 'block'; $('p-blocs').style.display = 'none'; majCouche(); }
  else finCouche();
};
$('couche').oninput = majCouche;
const CASE = 17, X0 = -1, X1 = 20, Z0 = -1, Z1 = 14;
function dessinerCouche(y) {
  const c = $('carte'), g = c.getContext('2d');
  c.width = (X1 - X0 + 1) * CASE; c.height = (Z1 - Z0 + 1) * CASE;
  g.fillStyle = '#17110c'; g.fillRect(0, 0, c.width, c.height);
  g.strokeStyle = '#2a2018'; for (let i = 0; i <= X1 - X0 + 1; i++) { g.beginPath(); g.moveTo(i * CASE + .5, 0); g.lineTo(i * CASE + .5, c.height); g.stroke(); }
  for (let i = 0; i <= Z1 - Z0 + 1; i++) { g.beginPath(); g.moveTo(0, i * CASE + .5); g.lineTo(c.width, i * CASE + .5); g.stroke(); }
  g.strokeStyle = '#c89a52'; g.setLineDash([4, 3]); g.strokeRect((X1 - 19) * CASE + .5, (Z1 - 9) * CASE + .5, 20 * CASE, 10 * CASE); g.setLineDash([]);
  const compte = new Map(), ici = BLOCS.filter(b => b.y === y);
  c._ici = ici;
  for (const b of ici) {
    const px = (X1 - b.x) * CASE, py = (Z1 - b.z) * CASE, def = T[b.t];
    compte.set(b.t, (compte.get(b.t) || 0) + 1);
    g.fillStyle = def.c;
    const plein = b.f === 'cube' || b.f === 'dalle' || b.f === 'dalle_h' || b.f === 'esc' || b.f === 'feu' || b.f === 'tapis' || b.f === 'coffre';
    if (plein) g.fillRect(px + 1, py + 1, CASE - 1, CASE - 1); else { g.beginPath(); g.arc(px + CASE / 2 + .5, py + CASE / 2 + .5, 4.5, 0, Math.PI * 2); g.fill(); }
    if (b.f === 'dalle' || b.f === 'dalle_h') { g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(px + 1, py + (b.f === 'dalle' ? 1 : CASE / 2), CASE - 1, CASE / 2); }
    if (b.f === 'esc') {
      g.fillStyle = 'rgba(255,240,200,0.9)';
      if (b.d === 'n') g.fillRect(px + 1, py + CASE - 4, CASE - 1, 3);
      if (b.d === 's') g.fillRect(px + 1, py + 1, CASE - 1, 3);
      if (b.d === 'w') g.fillRect(px + CASE - 4, py + 1, 3, CASE - 1);
      if (b.d === 'e') g.fillRect(px + 1, py + 1, 3, CASE - 1);
    }
  }
  $('pc-y').textContent = nomCouche(y);
  $('pc-info').textContent = ici.length ? `${ici.length} blocs sur cette couche` : 'rien sur cette couche';
  $('pc-liste').innerHTML = [...compte].sort((a, b) => b[1] - a[1]).map(([t, n]) => `<tr><td><span class="pastille" style="background:${T[t].c}"></span>${T[t].nom}</td><td class="n">${n}</td></tr>`).join('');
}
$('carte').onmousemove = (e) => {
  const r = e.target.getBoundingClientRect(), x = X1 - Math.floor((e.clientX - r.left) / CASE), z = Z1 - Math.floor((e.clientY - r.top) / CASE);
  const ici = (e.target._ici || []).filter(b => b.x === x && b.z === z);
  const bulle = $('bulle');
  if (!ici.length) { bulle.style.display = 'none'; return; }
  bulle.style.display = 'block'; bulle.style.left = e.clientX + 12 + 'px'; bulle.style.top = e.clientY + 12 + 'px';
  bulle.textContent = ici.map(b => T[b.t].nom).join(' + ') + `  (x ${x}, z ${z})`;
};
$('carte').onmouseleave = () => { $('bulle').style.display = 'none'; };

// liste des blocs
$('b-blocs').onclick = () => {
  const zones = { rdc: 'Le bar', cave: 'La cave + salle secrète', toit: 'Plafond, toit et cheminée' };
  let html = '';
  const total = new Map();
  for (const [z, nom] of Object.entries(zones)) {
    const c = new Map(); for (const b of BLOCS) if (zoneDe(b) === z) { c.set(b.t, (c.get(b.t) || 0) + 1); total.set(b.t, (total.get(b.t) || 0) + 1); }
    html += `<h3 style="color:#e0794f;margin:12px 0 4px">${nom}</h3><table>` + [...c].sort((a, b) => b[1] - a[1]).map(([t, n]) => `<tr><td><span class="pastille" style="background:${T[t].c}"></span>${T[t].nom}</td><td class="n">${n}</td><td class="n" style="color:#a68a64">${n >= 64 ? Math.floor(n / 64) + ' st' + (n % 64 ? ' + ' + n % 64 : '') : ''}</td></tr>`).join('') + '</table>';
  }
  html += `<h3 style="color:#e0794f;margin:12px 0 4px">Total</h3><table>` + [...total].sort((a, b) => b[1] - a[1]).map(([t, n]) => `<tr><td><span class="pastille" style="background:${T[t].c}"></span>${T[t].nom}</td><td class="n">${n}</td><td class="n" style="color:#a68a64">${n >= 64 ? Math.floor(n / 64) + ' st' + (n % 64 ? ' + ' + n % 64 : '') : ''}</td></tr>`).join('') + '</table>';
  html += '<p style="color:#a68a64">st = stacks de 64. Les escaliers et dalles sont comptés à la pièce.</p>';
  $('pb-contenu').innerHTML = html; $('p-blocs').style.display = 'block';

(async () => {
  try { await Promise.race([Promise.all([document.fonts.load("40px 'Rye'"), document.fonts.load("20px 'IM Fell English SC'")]), new Promise(ok => setTimeout(ok, 2500))]); } catch {}

  boucle();
})();
