<script type="module">
// Minato 3 : au niveau 2 (mode Kurama), la touche J le met 1 minute en MODE ROUGE (le skin du niveau 2 en rouge, les
// traits du mode Baryon, un manteau de chakra rouge et 6 flammes dans le dos), avec ses propres attaques, puis il
// redevient normal. Tout se calcule à partir du temps t de la scène choisie : on peut avancer, reculer, ralentir.
// Unités : 1 = 1 pixel du modèle (un bloc = 16), les pieds à y = 0, l'avant du joueur vers +z, sa gauche vers +x.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = (id) => document.getElementById(id);
const B = 16;
const TOUR = Math.PI * 2;
const seg = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
const lisse = (u) => { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); };
const entre = (a, b, u) => (Array.isArray(a) ? a.map((v, i) => v + (b[i] - v) * u) : a + (b - a) * u);
const elastique = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : 1 - Math.cos(u * Math.PI * 2.5) * Math.exp(-u * 5.5));
const hache = (i, j = 0, k = 0) => { let h = (i * 374761393 + j * 668265263 + k * 2147483647) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const V = (a) => new THREE.Vector3(a[0], a[1], a[2]);
const vers = (a, b) => Math.atan2(b[0] - a[0], b[2] - a[2]);

// ------------------------------------------------------------------ rendu, ciel, sol
const rendu = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
rendu.setPixelRatio(Math.min(2, devicePixelRatio));
rendu.setSize(innerWidth, innerHeight);
document.body.appendChild(rendu.domElement);
const scene = new THREE.Scene();
const BRUME = new THREE.Color('#9a6650');
scene.fog = new THREE.Fog(BRUME.clone(), 900, 3400);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 9000);
const controles = new OrbitControls(camera, rendu.domElement);
controles.enabled = false;
scene.add(new THREE.HemisphereLight(0xfff0e6, 0x6a4a3a, 2.2));
const soleil = new THREE.DirectionalLight(0xffe2c8, 2.0);
soleil.position.set(-300, 500, 420);
scene.add(soleil);

// le ciel du coucher de soleil, comme l'image de référence
const ciel = new THREE.Mesh(new THREE.SphereGeometry(6000, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uSombre: { value: 0 } },
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform float uSombre; varying vec3 vP;
    void main(){ float h = normalize(vP).y;
      vec3 bas = vec3(0.85, 0.42, 0.20), milieu = vec3(0.42, 0.13, 0.08), haut = vec3(0.10, 0.03, 0.04);
      vec3 c = h < 0.0 ? bas * 0.6 : mix(mix(bas, milieu, smoothstep(0.0, 0.18, h)), haut, smoothstep(0.18, 0.7, h));
      gl_FragColor = vec4(c * (1.0 - 0.55 * uSombre), 1.0); }`,
}));
scene.add(ciel);

function texturePixels(taille, couleur) {
  const c = document.createElement('canvas');
  c.width = c.height = taille;
  const g = c.getContext('2d');
  for (let y = 0; y < taille; y++) for (let x = 0; x < taille; x++) { g.fillStyle = couleur(x, y); g.fillRect(x, y, 1, 1); }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestMipmapLinearFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
// une plaine de terre battue et de cailloux (le champ de bataille de la référence)
const TERRE = texturePixels(64, (x, y) => {
  const bloc = hache(Math.floor(x / 16), Math.floor(y / 16), 7), p = hache(x, y, 3);
  const base = bloc < 0.25 ? [128, 112, 98] : [150, 118, 88];
  const k = 0.82 + 0.3 * p;
  return `rgb(${base.map((v) => Math.round(v * k)).join(',')})`;
});
TERRE.repeat.set(6000 / 64, 6000 / 64);
const sol = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.MeshLambertMaterial({ map: TERRE }));
sol.rotation.x = -Math.PI / 2;
scene.add(sol);
// des rochers en blocs et des montagnes au loin
const PIERRE = new THREE.MeshLambertMaterial({ color: '#8a7a6a' });
for (let q = 0; q < 46; q++) {
  const a = hache(q, 1, 40) * TOUR, d = 700 + 1500 * hache(q, 2, 40), s = 16 * (1 + Math.floor(3 * hache(q, 3, 40)));
  const m = new THREE.Mesh(new THREE.BoxGeometry(s * (1 + hache(q, 4)), s * (0.6 + hache(q, 5)), s), PIERRE);
  m.position.set(Math.cos(a) * d, s * 0.3, Math.sin(a) * d);
  m.rotation.y = a;
  scene.add(m);
}
const MONT = new THREE.MeshLambertMaterial({ color: '#5a3a30' });
for (let q = 0; q < 14; q++) {
  const a = (q / 14) * TOUR + hache(q, 9) * 0.3, h = 500 + 600 * hache(q, 8);
  const m = new THREE.Mesh(new THREE.ConeGeometry(900 + 500 * hache(q, 7), h, 5), MONT);
  m.position.set(Math.cos(a) * 3600, h / 2 - 40, Math.sin(a) * 3600);
  scene.add(m);
}

// ------------------------------------------------------------------ les joueurs (modèle Minecraft, skin 64×64)
const chargeur = new THREE.TextureLoader();
const SKINS = {};
function skin(nom) {
  if (!SKINS[nom]) {
    const t = chargeur.load('skins/' + nom + '.png');
    t.magFilter = THREE.NearestFilter;
    t.minFilter = THREE.NearestFilter;
    t.colorSpace = THREE.SRGBColorSpace;
    SKINS[nom] = t;
  }
  return SKINS[nom];
}
const PARTIES = {
  tete: { b: [-4, 24, -4, 4, 32, 4], p: [0, 24, 0], uv: [0, 0], uv2: [32, 0], g: 0.5 },
  corps: { b: [-4, 12, -2, 4, 24, 2], p: [0, 12, 0], uv: [16, 16], uv2: [16, 32], g: 0.25 },
  brasD: { b: [-8, 12, -2, -4, 24, 2], p: [-6, 22, 0], uv: [40, 16], uv2: [40, 32], g: 0.25 },
  brasG: { b: [4, 12, -2, 8, 24, 2], p: [6, 22, 0], uv: [32, 48], uv2: [48, 48], g: 0.25 },
  jambeD: { b: [-4, 0, -2, 0, 12, 2], p: [-2, 12, 0], uv: [0, 16], uv2: [0, 32], g: 0.25 },
  jambeG: { b: [0, 0, -2, 4, 12, 2], p: [2, 12, 0], uv: [16, 48], uv2: [0, 48], g: 0.25 },
};
/** Une boîte aux UV du skin (faces +x, -x, +y, -y, +z, -z de three = gauche, droite, dessus, dessous, devant, dos). */
function boite(w, h, d, u, v, g) {
  const geo = new THREE.BoxGeometry(w + 2 * g, h + 2 * g, d + 2 * g);
  const faces = [[u + d + w, v + d, d, h], [u, v + d, d, h], [u + d, v, w, d], [u + d + w, v, w, d], [u + d, v + d, w, h], [u + d + w + d, v + d, w, h]];
  const uv = geo.attributes.uv;
  for (let f = 0; f < 6; f++) {
    const [x0, y0, fw, fh] = faces[f];
    for (let k = 0; k < 4; k++) {
      const i = f * 4 + k, a = uv.getX(i), b = uv.getY(i);
      uv.setXY(i, (x0 + a * fw) / 64, 1 - (y0 + (1 - b) * fh) / 64);
    }
  }
  return geo;
}
function creerJoueur(tex, fantome = false) {
  const racine = new THREE.Group();
  const m1 = fantome
    ? new THREE.MeshBasicMaterial({ color: '#ff3018', transparent: true, opacity: 0.45, depthWrite: false, blending: THREE.AdditiveBlending })
    : new THREE.MeshLambertMaterial({ map: tex, alphaTest: 0.5 });
  const m2 = fantome ? null : new THREE.MeshLambertMaterial({ map: tex, alphaTest: 0.5, transparent: true });
  const J = { racine, m1, m2, parts: {} };
  for (const [nom, P] of Object.entries(PARTIES)) {
    const [x0, y0, z0, x1, y1, z1] = P.b, w = x1 - x0, h = y1 - y0, d = z1 - z0;
    const piv = new THREE.Group();
    piv.position.set(...P.p);
    racine.add(piv);
    const c = [(x0 + x1) / 2 - P.p[0], (y0 + y1) / 2 - P.p[1], (z0 + z1) / 2 - P.p[2]];
    const a = new THREE.Mesh(boite(w, h, d, P.uv[0], P.uv[1], 0), m1);
    a.position.set(...c);
    piv.add(a);
    if (m2) {
      const b = new THREE.Mesh(boite(w, h, d, P.uv2[0], P.uv2[1], P.g), m2);
      b.position.set(...c);
      piv.add(b);
    }
    J.parts[nom] = piv;
  }
  scene.add(racine);
  return J;
}
/** Pose : o.pos, o.lacet (0 = regarde +z), o.penche (en avant +), o.roule, o.brasD = [rx, rz, ry]… (rx négatif = vers l'avant). */
function poser(J, o) {
  J.racine.visible = o.visible !== false;
  J.racine.position.set(...(o.pos ?? [0, 0, 0]));
  J.racine.rotation.set(o.penche ?? 0, o.lacet ?? 0, o.roule ?? 0, 'YXZ');
  for (const n of ['brasD', 'brasG', 'jambeD', 'jambeG', 'tete']) {
    const v = o[n] ?? [0, 0, 0];
    J.parts[n].rotation.set(v[0] ?? 0, v[2] ?? 0, v[1] ?? 0);
  }
  J.racine.updateMatrixWorld(true);
}
const main = (J) => J.parts.brasD.localToWorld(new THREE.Vector3(0, -12.5, 0.5));
const torse = (o) => [o[0], (o[1] ?? 0) + 18, o[2]];

// les poses
const P = {
  repos: { brasD: [0.05, -0.08], brasG: [0.05, 0.08] },
  garde: { brasD: [-1.0, -0.35], brasG: [-0.5, 0.45], jambeD: [0.25], jambeG: [-0.3] },
  fier: { brasD: [0.15, -0.28], brasG: [0.15, 0.28], tete: [-0.08] },
  bras: { brasD: [-0.25, -1.1], brasG: [-0.25, 1.1], tete: [-0.15] },
  accroupi: { penche: 0.25, brasD: [-0.7, -0.55], brasG: [-0.7, 0.55], jambeD: [-0.6], jambeG: [-0.3], tete: [-0.35] },
  lancer: { brasD: [-2.6, -0.25], brasG: [0.5, 0.3], jambeD: [0.4], jambeG: [-0.4] },
  tendu: { brasD: [-1.55, 0.05], brasG: [0.5, 0.2], jambeD: [0.35], jambeG: [-0.35] },
  leve: { brasD: [-3.0, -0.05], brasG: [-0.3, 0.4] },
  croise: { brasD: [-1.3, 0.75], brasG: [-1.3, -0.75], tete: [0.25] },
  pied: { brasD: [-0.6, -0.9], brasG: [-0.6, 0.9], jambeD: [-2.3], jambeG: [0.3], penche: -0.2 },
  dash: { penche: 0.55, brasD: [1.1, -0.2], brasG: [1.1, 0.2], jambeD: [-0.7], jambeG: [0.6] },
  apres: { brasD: [-0.2, -1.35, 0.3], brasG: [0.1, 0.2], tete: [0.05] },
};
/** Le coup de kunai : u de 0 (bras armé en haut à droite) à 1 (fin du geste, en bas à gauche). */
const frappe = (u) => ({ brasD: [entre(-2.6, -0.6, u), entre(-0.9, 0.7, u)], brasG: [0.4, 0.3], jambeD: [0.35], jambeG: [-0.35], penche: 0.1 });
const course = (ph) => ({ penche: 0.3, brasD: [Math.sin(ph) * 1.1, -0.1], brasG: [-Math.sin(ph) * 1.1, 0.1], jambeD: [-Math.sin(ph) * 1.0], jambeG: [Math.sin(ph) * 1.0] });
const aTerre = { penche: -Math.PI / 2, brasD: [-0.3, -0.5], brasG: [-0.3, 0.5] };

// ------------------------------------------------------------------ le chakra rouge (manteau, flammes, Rasengan, dôme)
const vChakra = `uniform float uTemps; uniform float uOndule; varying vec3 vN; varying vec3 vVue; varying vec3 vPos;
  void main(){ vec3 p = position + normal * sin(uTemps * 4.0 + position.y * 0.25 + position.x * 0.2) * uOndule;
    vec4 mv = modelViewMatrix * vec4(p, 1.0); vN = normalize(normalMatrix * normal); vVue = normalize(-mv.xyz); vPos = p;
    gl_Position = projectionMatrix * mv; }`;
const fChakra = `uniform float uTemps; uniform float uAlpha; uniform float uPaillettes; uniform vec3 uCoeur; uniform vec3 uBord; varying vec3 vN; varying vec3 vVue; varying vec3 vPos;
  float h(vec3 p){ return fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }
  void main(){ float f = pow(1.0 - abs(dot(normalize(vN), normalize(vVue))), 1.7);
    vec3 c = mix(uCoeur, uBord, f);
    float s = step(0.996, h(floor(vPos * 2.2 + vec3(0.0, -uTemps * 6.0, 0.0)))) * uPaillettes;
    c += vec3(1.0, 0.85, 0.7) * s * 1.6;
    gl_FragColor = vec4(c, clamp(uAlpha * (0.6 + 0.4 * f) + s * 0.6, 0.0, 1.0)); }`;
const CHAKRAS = [];
function matChakra(o = {}) {
  const m = new THREE.ShaderMaterial({
    uniforms: {
      uTemps: { value: 0 }, uAlpha: { value: o.alpha ?? 0.85 }, uOndule: { value: o.ondule ?? 0.2 }, uPaillettes: { value: o.paillettes ?? 1 },
      uCoeur: { value: new THREE.Color(o.coeur ?? '#e0140a') }, uBord: { value: new THREE.Color(o.bord ?? '#ffc2b4') },
    },
    vertexShader: vChakra, fragmentShader: fChakra, transparent: true, depthWrite: false, side: THREE.DoubleSide,
    blending: o.additif ? THREE.AdditiveBlending : THREE.NormalBlending,
  });
  m.alphaBase = o.alpha ?? 0.85;
  CHAKRAS.push(m);
  return m;
}

// Le manteau Baryon, d'après les images de référence : UN manteau de chakra (col haut, fermé sur la poitrine par la
// spirale, ouvert en V dessous) d'où sortent de grandes langues souples qui ondulent derrière lui, comme un manteau dans
// le vent. Dessin d'anime : un rouge plein, un large bord crème qui brille, des traits noirs qui suivent le tissu.
const vBaryon = `attribute float aBord; attribute float aU; attribute float aRaie; attribute vec3 aDir;
  uniform float uTemps; uniform float uOnde; uniform float uPhase;
  varying float vBord; varying float vRaie; varying vec3 vN; varying vec3 vVue;
  void main(){ vBord = aBord; vRaie = aRaie;
    vec3 p = position + aDir * sin(uTemps * 2.6 + aU * 5.5 + uPhase) * uOnde * aU * aU;
    vec4 mv = modelViewMatrix * vec4(p, 1.0); vN = normalize(normalMatrix * normal); vVue = normalize(-mv.xyz);
    gl_Position = projectionMatrix * mv; }`;
const fBaryon = `uniform float uContour; uniform float uAlpha; uniform vec3 uCoeur; uniform vec3 uVif; uniform vec3 uBord;
  varying float vBord; varying float vRaie; varying vec3 vN; varying vec3 vVue;
  void main(){
    float f = pow(1.0 - abs(dot(normalize(vN), normalize(vVue))), 2.0);
    vec3 c = mix(uCoeur, uVif, clamp(smoothstep(0.15, 0.75, vBord) + 0.3 * f, 0.0, 1.0));
    float b = smoothstep(0.7, 0.88, max(vBord, f * uContour));
    c = mix(c, uBord, b);
    float raie = 1.0 - smoothstep(0.03, 0.065, abs(vRaie));
    c = mix(c, vec3(0.09, 0.012, 0.008), raie * 0.92 * (1.0 - b));
    gl_FragColor = vec4(c, uAlpha * mix(0.88, 1.0, b)); }`;
function matBaryon(phase = 0, onde = 2.4, plein = false, contour = 1.15) {
  const m = new THREE.ShaderMaterial({
    uniforms: {
      uTemps: { value: 0 }, uOnde: { value: onde }, uPhase: { value: phase }, uAlpha: { value: 0.92 }, uContour: { value: contour },
      uCoeur: { value: new THREE.Color('#c40e08') }, uVif: { value: new THREE.Color('#ff3c1e') }, uBord: { value: new THREE.Color('#ffe4d2') },
    },
    vertexShader: vBaryon, fragmentShader: fBaryon, transparent: true, depthWrite: plein, side: THREE.DoubleSide,
  });
  CHAKRAS.push(m);
  return m;
}

/** Une surface en grille : f(u, v) → { p, bord (0 dedans, 1 au bord), raie (distance au trait noir), onde }. */
function grille(NU, NV, f) {
  const pos = [], bord = [], onde = [], raie = [], dir = [], idx = [];
  for (let i = 0; i <= NU; i++) for (let j = 0; j <= NV; j++) {
    const r = f(i / NU, j / NV);
    pos.push(...r.p); bord.push(Math.max(0, Math.min(1, r.bord))); onde.push(r.onde ?? i / NU); raie.push(r.raie ?? 9); dir.push(...(r.dir ?? [0, 0, 0]));
  }
  for (let i = 0; i < NU; i++) for (let j = 0; j < NV; j++) {
    const a = i * (NV + 1) + j, b = a + NV + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aBord', new THREE.Float32BufferAttribute(bord, 1));
  g.setAttribute('aU', new THREE.Float32BufferAttribute(onde, 1));
  g.setAttribute('aRaie', new THREE.Float32BufferAttribute(raie, 1));
  g.setAttribute('aDir', new THREE.Float32BufferAttribute(dir, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/**
 * Une langue de chakra en volume : une section ovale le long d'une courbe (pts, la racine en premier, cachée sous le
 * manteau), étroite à la racine, large aux deux cinquièmes, puis en pointe ; épaisse au milieu comme une vraie flamme.
 * n0 : vers où elle fait face (sa face large).
 */
function langueGeo(pts, W, n0, raie, tordre = 0) {
  const courbe = new THREE.CatmullRomCurve3(pts.map((p) => new THREE.Vector3(...p)), false, 'centripetal');
  const N0 = new THREE.Vector3(...n0).normalize();

/** Le manteau : les épaules, puis il tombe jusqu'aux genoux en s'évasant, ouvert en V sous la spirale. */
function manteauGeo() {
  return grille(36, 56, (a, b) => {
    const s = -0.25 + 1.25 * a;
    let rx, rz, y, tm;
    if (s < 0) {
      const u = (s + 0.25) / 0.25;
      rx = entre(4.4, 8.9, u); rz = entre(2.6, 3.9, u); y = entre(25.8, 24.6, u); tm = Math.PI - 0.08;
    } else {
      rx = 8.9 + 4.6 * s; rz = 3.9 + 5.6 * s; y = 24.6 - 17.6 * s; tm = Math.PI - (0.08 + 1.35 * Math.pow(s, 0.8));
    }
    const th = -tm + 2 * tm * b;
    // le bas se découpe en pointes, comme des flammes
    if (s > 0.6) y -= 3.2 * Math.pow(Math.max(0, Math.sin(th * 3.5 + 0.6)), 3) * ((s - 0.6) / 0.4) ** 2;
    const bordV = 1 - ((tm - Math.abs(th)) * rx) / 7;
    const bordH = s > 0 ? 1 - ((1 - s) * 17.6) / 7 : 0;
    const raie = Math.min(Math.abs(s - (0.1 + 0.2 * Math.cos(th) ** 2)), Math.abs(s - (0.45 + 0.14 * Math.sin(2 * th)))) * 3;
    return { p: [rx * Math.sin(th), y, -rz * Math.cos(th)], bord: Math.max(bordV, bordH), raie: s > 0.02 ? raie : 9, onde: Math.max(0, s) * 0.6, dir: [Math.sin(th), 0, -Math.cos(th)] };
  });
}

    const th = -tm + 2 * tm * b;

    const hc = 6.2 + 1.2 * Math.cos(th) + 2.6 * Math.pow(Math.abs(th) / tm, 6);
    const bord = Math.max(1 - ((1 - a) * hc) / 6, 1 - ((tm - Math.abs(th)) * rx) / 6);
    return { p: [rx * Math.sin(th), 24.9 + a * hc, -rz * Math.cos(th)], bord, onde: 0 };

}

  for (let q = 0; q <= 120; q++) { const a = (q / 120) * TOUR * 2.2, r = 10 + q * 0.85; g[q ? 'lineTo' : 'moveTo'](m + Math.cos(a) * r, m + Math.sin(a) * r); }

      cible({ pos: [0, 0, 60 - 30 * lisse(seg(t, 0.4, 1.6))], lacet: Math.PI, ...course(t * 9) });
    },
    cam(t) { return { pos: [90, 30, 70], vise: [0, 18, 20] }; },
  },
  {
    id: 'ulti', nom: 'J dans le mode : MILLE FLASHS', duree: 13.5,
    legendes: [
      [0, 0.7, 'IL PLANTE SON KUNAI DANS LE SOL…'],
      [0.7, 1.7, 'UN SCEAU GÉANT S\'ÉTEND : 25 BLOCS AUTOUR DE LUI'],
      [1.7, 2.4, 'LE TEMPS S\'ARRÊTE : TOUT DEVIENT GRIS, SAUF LUI'],
      [2.4, 6.0, 'MILLE FLASHS : IL FRAPPE TOUT LE MONDE DE PARTOUT, CHAQUE TP LAISSE UN TRAIT ROUGE'],
      [6.0, 8.0, 'IL APPARAÎT DANS LE CIEL : UN RASENGAN ROUGE GÉANT'],
      [8.0, 8.5, 'FLASH : IL L\'ÉCRASE AU CENTRE DU SCEAU…'],
      [8.5, 10.8, '… ET LE TEMPS REPART : TOUS LES COUPS TOMBENT D\'UN COUP'],
      [10.8, 13.5, 'MILLE FLASHS. UNE FOIS PAR MODE ROUGE'],
    ],
    degats: '5 coups de 3 sur chacun pendant le temps arrêté, puis 20 à l\'explosion (dont 10 qui traversent l\'armure), et projetés. Ceux qui sont dans le sceau ne peuvent ni bouger ni frapper pendant le temps arrêté.',
    maj(t) {
      const R = 25 * B;
      const C = Array.from({ length: 6 }, (_, i) => { const a = (i * TOUR) / 6 + 0.4, d = 150 + 110 * hache(i, 3, 5); return [Math.sin(a) * d, 0, Math.cos(a) * d]; });
      const fige = t >= 1.7 && t < 8.5;
      gris = t < 1.7 ? 0 : t < 2.1 ? seg(t, 1.7, 2.1) : t < 8.5 ? 1 : 1 - seg(t, 8.5, 8.7);
      ciel.material.uniforms.uSombre.value = t > 0.7 && t < 11 ? Math.min(1, seg(t, 0.7, 1.6)) : 0;
      // Minato
      const N = 30, T0 = 2.4, PAS = (5.8 - T0) / N;
      const stops = Array.from({ length: N }, (_, s) => {
        const c = C[s % 6], a = hache(s, 1, 9) * TOUR, d = 18 + 10 * hache(s, 2, 9);
        return [c[0] + Math.sin(a) * d, 30 * hache(s, 3, 9) ** 2, c[2] + Math.cos(a) * d];
      });
      let mp = [0, 0, 0], ml = 0, pose = P.leve, vis = true, flam = 1;
      if (t >= 0.5 && t < 2.4) { pose = P.accroupi; mp = [0, -2, 0]; }
      const i = Math.floor((t - T0) / PAS);
      if (t >= T0 && i < N) { mp = stops[i]; ml = vers(mp, C[i % 6]); pose = frappe(lisse(((t - T0) % PAS) / 0.08)); }
      if (t >= 5.8 && t < 6.05) vis = false;
      if (t >= 6.05 && t < 8.0) { mp = [0, 520, 0]; ml = 0; pose = P.leve; flam = 1 + 0.6 * lisse(seg(t, 6.05, 7.5)); }
      if (t >= 8.0 && t < 10.8) { mp = [0, 0, 0]; pose = { ...P.tendu, brasD: [-2.2, 0.05], penche: 0.5 }; }
      if (t >= 10.8) { mp = [0, 0, 0]; ml = 0.3; pose = P.fier; }
      poser(M, { ...pose, pos: mp, lacet: ml, visible: vis });
      modeRouge(1, true, t, flam);
      // le kunai planté et le sceau
      if (t >= 0.6 && t < 10.8) kunai([3, 3, 6], [0, -1, 0.15], 1.5);
      const rs = R * (1 - (1 - seg(t, 0.7, 1.7)) ** 3);
      sceau.visible = t >= 0.7 && t < 10.8;
      sceau.scale.setScalar(Math.max(0.01, rs));
      sceau.material.opacity = t < 8.5 ? 1 : 1 - seg(t, 8.5, 10.8);
      flash([3, 6, 6], t - 0.62, 0.4, 2);
      anneau([0, 0, 0], t - 0.62, 1.1, R * 1.05);
      // les cibles : elles accourent, puis figées
      C.forEach((c, k) => {
        const tf = Math.min(t, 1.7), avance = 30 * tf;
        const l = vers(c, [0, 0, 0]);
        let p = [c[0] - Math.sin(l) * avance, 0, c[2] - Math.cos(l) * avance];
        let o = { ...course(tf * 9 + k), lacet: l };
        if (t >= 8.5) {
          const v = t - 8.5, vo = Math.min(v, 1.2) / 1.2;
          const loin = 160 + 40 * hache(k, 7);
          p = [p[0] + Math.sin(l) * -loin * (1 - (1 - vo) ** 2), Math.max(0, 140 * vo - 140 * vo * vo), p[2] + Math.cos(l) * -loin * (1 - (1 - vo) ** 2)];
          o = v < 1.2 ? { ...aTerre, lacet: l + v * 6, penche: -v * 7 } : { ...aTerre, lacet: l };
        }
        cible({ ...o, pos: p });
        C[k] = p;
        // le kunai figé au-dessus d'eux
        if (t >= 2.0 && t < 8.5) { kunai([p[0], 44, p[2]], [0, -1, 0], 1.6); anneau([p[0], 0, p[2]], 0.3, 1, 18 * lisse(seg(t, 2.0, 2.3))); }
        flash([p[0], 44, p[2]], t - 2.0 - k * 0.04, 0.3, 0.8);
        // tout tombe d'un coup
        flash(torse(p), t - 8.5 - k * 0.03, 0.5, 2.4);
        eclats(torse(p), t - 8.5, 1.2, 160, 300 + k);
      });
      // mille flashs : un trait rouge d'un arrêt au suivant, qui reste jusqu'à la reprise du temps
      for (let s = 0; s < N; s++) {
        const ts = T0 + s * PAS;
        if (t < ts) break;
        const p = stops[s];
        flash(torse(p), t - ts, 0.3, 1.1);
        arc(torse(C[s % 6]), vers(p, C[s % 6]), (hache(s, 4, 9) - 0.5) * 1.6, t - ts - 0.03, 0.4);
        if (s > 0) trait(torse(stops[s - 1]), torse(p), t - ts, 8.75 - ts, 0.9, t > 8.3 ? 2.2 : 1);
        if (t < 8.5) fantome({ ...frappe(1), pos: p, lacet: vers(p, C[s % 6]) }, 0.45 * (1 - seg(t, ts, ts + 0.5)));
      }
      // le Rasengan géant dans le ciel, puis au centre
      const h = main(M);
      if (t >= 6.05 && t < 8.0) {
        const r = 90 * lisse(seg(t, 6.1, 7.6));
        rasengan([h.x, h.y + r * 1.05 + 6, h.z], r, t);
        for (let q = 0; q < 4; q++) eclats([h.x, h.y + r, h.z], (t + q * 0.25) % 1, 1, -110, 400 + q, '#ffb0a0');
      }
      if (t >= 8.0 && t < 8.6) rasengan([0, 40, 26], 90 * (1 - 0.25 * seg(t, 8.0, 8.5)), t);
      flash([0, 540, 0], t - 8.0, 0.35, 4);
      flash([0, 30, 0], t - 8.0, 0.4, 5);
      trait([0, 600, 0], [0, 10, 0], t - 8.0, 0.4, 6, 1.5);
      // l'explosion
      const e = t - 8.5;
      dome([0, 0, 0], R * 1.15 * (1 - (1 - seg(t, 8.5, 9.7)) ** 3), e >= 0 ? 0.75 * (1 - seg(t, 9.7, 10.8)) : 0);
      anneau([0, 0, 0], e, 1.4, R * 1.6);
      anneau([0, 0, 0], e - 0.25, 1.6, R * 2.2, '#ff9a60');
      eclats([0, 30, 0], e, 2.0, 380, 500);
      eclats([0, 30, 0], e - 0.1, 2.0, 280, 501, '#ffd0b0');
      cratere([0, 0, 0], R * 0.55, e);
      blanc = e >= 0 && e < 0.3 ? 0.85 * (1 - e / 0.3) : 0;
      teinteRouge = e >= 0 && e < 2 ? 0.45 * (1 - e / 2) : 0;
      secousse = e >= 0 && e < 1.6 ? 9 * (1 - e / 1.6) : t >= 8.0 && t < 8.5 ? 2 : 0;
      void fige;
    },
    cam(t) {
      if (t < 1.7) { const u = lisse(seg(t, 0.6, 1.7)); return { pos: entre([110, 36, 150], [0, 760, 330], u), vise: entre([0, 14, 0], [0, 0, 0], u) }; }
      if (t < 2.4) return { pos: [0, 760, 330], vise: [0, 0, 0] };
      if (t < 5.9) { const a = lisse(seg(t, 2.4, 5.9)) * Math.PI * 1.3; return { pos: [Math.sin(a) * 560, 230, Math.cos(a) * 560], vise: [0, 20, 0] }; }
      if (t < 8.0) { const u = lisse(seg(t, 6.0, 8.0)); return { pos: entre([230, 330, 360], [150, 390, 240], u), vise: [0, 565, 0] }; }
      if (t < 8.5) return { pos: [0, 420, 640], vise: [0, 30, 0] };
      if (t < 10.8) return { pos: [0, 300, 1000], vise: [0, 60, 0] };
      const u = lisse(seg(t, 10.8, 13.5));
      return { pos: entre([220, 70, 280], [70, 30, 110], u), vise: [0, 20, 0] };
    },
  },
];

// ------------------------------------------------------------------ l'interface
let courante = SCENES[0], t = 0, lecture = true, vitesse = 1, libre = false;
const btns = SCENES.map((s) => {
  const b = document.createElement('button');
  b.textContent = s.nom;
  b.onclick = () => choisir(s.id);
  $('scenes').appendChild(b);
  return b;
});
function choisir(id) {
  courante = SCENES.find((s) => s.id === id) ?? SCENES[0];
  t = 0;
  $('temps').max = courante.duree;
  btns.forEach((b, k) => b.classList.toggle('actif', SCENES[k] === courante));
  $('degats').textContent = 'Dégâts / détails : ' + courante.degats;
  history.replaceState(null, '', '#' + courante.id);
}
$('lecture').onclick = () => { lecture = !lecture; $('lecture').textContent = lecture ? 'Pause' : 'Lecture'; $('lecture').classList.toggle('actif', lecture); };
$('debut').onclick = () => { t = 0; };
$('ralenti').onclick = () => { vitesse = vitesse === 1 ? 0.3 : 1; $('ralenti').classList.toggle('actif', vitesse !== 1); };
$('temps').oninput = (e) => { t = +e.target.value; };
$('camLibre').onclick = () => { libre = !libre; controles.enabled = libre; $('camLibre').classList.toggle('actif', libre); };
$('manteau').onclick = () => { manteauOui = !manteauOui; $('manteau').textContent = 'Manteau : ' + (manteauOui ? 'oui' : 'non'); $('manteau').classList.toggle('actif', manteauOui); };
$('son').onclick = () => { sonOui = !sonOui; $('son').textContent = 'Son : ' + (sonOui ? 'oui' : 'non'); $('son').classList.toggle('actif', sonOui); };
choisir(location.hash.slice(1) || 'tenue');

function panneau() {
  const reste = courante.id === 'tenue' ? (t < 2.2 ? null : Math.max(0, 60 - Math.round((t - 2.2) * (t > 7.2 ? 59 / 5 : 2)))) : 47;
  if (reste === null || (courante.id === 'tenue' && t > 8.2)) {
    $('panneau').innerHTML = '<b><span>MINATO · MODE KURAMA</span></b><div class="l"><span class="t">J</span><span>Mode rouge</span></div>';
    return;
  }
  const m = Math.floor(reste / 60), s = String(reste % 60).padStart(2, '0');
  $('panneau').innerHTML = `<b><span>MINATO · MODE ROUGE</span><span>${m}:${s}</span></b>` +
    PANNEAU.map(([touche, quoi, id]) => `<div class="l${id === courante.id ? ' on' : ''}"><span class="t">${touche}</span><span>${quoi}</span></div>`).join('');
}

// le son du flash de Minato (voix/effets/minato.flash.ogg, comme en jeu avec le pack privé)
let pasCourant = 0, sonOui = true, dernierSon = 0, tamponFlash = null;
const audio = new (window.AudioContext || window.webkitAudioContext)();
fetch('son/minato.flash.ogg').then((r) => (r.ok ? r.arrayBuffer() : Promise.reject())).then((b) => audio.decodeAudioData(b)).then((d) => { tamponFlash = d; }).catch(() => {});
addEventListener('pointerdown', () => audio.resume());
function jouerFlash() {
  if (!sonOui || !tamponFlash || performance.now() - dernierSon < 70) return;
  dernierSon = performance.now();
  const src = audio.createBufferSource(), g = audio.createGain();
  src.buffer = tamponFlash;
  src.playbackRate.value = 0.95 + Math.random() * 0.12;
  g.gain.value = 0.55;
  src.connect(g).connect(audio.destination);
  src.start();
}
const horloge = new THREE.Clock();
function image() {
  const dt = Math.min(0.05, horloge.getDelta());
  pasCourant = lecture ? dt * vitesse : 0;
  if (lecture) { t += dt * vitesse; if (t > courante.duree + 0.8) t = 0; }
  const tc = Math.min(t, courante.duree);
  for (const r of [R_FLASH, R_ETOILE, R_TRAIT, R_COEUR, R_ARC, R_ECLATS, R_ANNEAU, R_CRATERE, R_KUNAI, R_FANTOME, R_CIBLE, R_RASENGAN, R_DOME, R_PILIER]) r.vider();
  secousse = 0; gris = 0; teinteRouge = 0; blanc = 0;
  sceau.visible = false;
  ciel.material.uniforms.uSombre.value = 0;
  for (const m of CHAKRAS) m.uniforms.uTemps.value = tc;
  courante.maj(tc);
  passeGris.uniforms.uGris.value = gris;
  passeGris.uniforms.uRouge.value = teinteRouge;
  passeGris.uniforms.uBlanc.value = blanc;
  if (!libre) {
    const c = courante.cam(tc);
    const s = secousse;
    camera.position.set(c.pos[0] + (Math.random() - 0.5) * s, c.pos[1] + (Math.random() - 0.5) * s, c.pos[2] + (Math.random() - 0.5) * s);
    camera.lookAt(...c.vise);
    controles.target.set(...c.vise);
  } else controles.update();
  $('temps').value = tc;
  $('horloge').textContent = tc.toFixed(1).replace('.', ',') + ' s';
  const l = courante.legendes.find(([a, b]) => tc >= a && tc < b);
  $('legende').textContent = l ? l[2] : '';
  $('titre').textContent = courante.nom.toUpperCase();
  $('titre').style.opacity = String(tc < 0.15 ? tc / 0.15 : 1 - seg(tc, 1.0, 1.5));
  panneau();
  composeur.render();
}
rendu.setAnimationLoop(image);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  rendu.setSize(innerWidth, innerHeight);
  composeur.setSize(innerWidth, innerHeight);
});

window.aller = (id, temps) => { lecture = false; libre = false; controles.enabled = false; choisir(id); t = temps; image(); };
window.cam = (p, v) => { libre = true; controles.enabled = true; camera.position.set(...p); controles.target.set(...v); controles.update(); image(); };
// pour la planche : window.capturer('ulti', 7.2, 'ulti-3.png') fige la scène à ce moment et enregistre l'image
window.capturer = async (id, temps, nom, vue = null, manteau = true) => {
  lecture = false;
  libre = false;
  controles.enabled = false;
  manteauOui = manteau;
  choisir(id);
  t = temps;
  if (vue) { libre = true; camera.position.set(...vue[0]); controles.target.set(...vue[1]); controles.update(); }
  image();
  manteauOui = true;
  libre = false;
  const url = rendu.domElement.toDataURL('image/png');
  await fetch('/capture?nom=' + encodeURIComponent(nom), { method: 'POST', body: url });
  return nom;
};
</script>
