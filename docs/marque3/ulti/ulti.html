<title>Ulti de la marque 3</title>
<!--
  Aperçu 3D de l'ulti de la marque maudite 3 : l'invocation du serpent géant (le grand serpent violet d'Orochimaru).
  Il saute, plaque les mains au sol (le sceau s'étale), pouf : un énorme serpent violet en cubes se dresse, lui debout
  sur sa tête. Le serpent siffle, prend son élan et fonce droit devant, gueule ouverte : des blocs volent (le sol reste intact), les blocs
  volent, les arbres, les joueurs et la maison devant sont projetés. Impact, puis il disparaît en fumée.
  Tout est en blocs (1 unité = 1 bloc). Servi par serveur.mjs (port 8769) ; « Planche » enregistre planche-ulti.png.
-->

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

import { LH, CHARN, LB, largeur, hMach, rayon, construireSerpent } from './serpent.mjs';

// ------------------------------------------------------------------ petits outils
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lisse = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const lerpV = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const C = (r, g, b) => [r / 255, g / 255, b / 255];
const mixC = (a, b, k) => lerpV(a, b, clamp(k, 0, 1));
/** Une valeur qui suit des clés [temps, valeur], adoucie entre deux clés. */
function cles(T, L) {
  if (T <= L[0][0]) return L[0][1];
  for (let i = 1; i < L.length; i++) if (T < L[i][0]) return lerp(L[i - 1][1], L[i][1], lisse((T - L[i - 1][0]) / (L[i][0] - L[i - 1][0])));
  return L[L.length - 1][1];
}
function graine(s) { return () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let A = graine(7);
const al = (a, b) => a + (b - a) * A();

// ------------------------------------------------------------------ le déroulé (secondes)
const T_SAUT = 0.15, T_POSE = 1.0, T_POUF = 2.25, T_SIFFLE = 3.0, T_ELAN = 4.3, T_CHARGE = 5.0, DUREE_CHARGE = 4.2;
const T_IMPACT = T_CHARGE + DUREE_CHARGE, T_DISPARAIT = T_IMPACT + 0.55, T_FIN = 13;
const PHASES = [[0, '1. Il saute'], [T_POSE, '2. Les mains au sol : le sceau'], [T_POUF, '3. Pouf ! L\'invocation'], [T_SIFFLE, '4. Le serpent se dresse et siffle'], [T_ELAN, '5. L\'élan'], [T_CHARGE, '6. La charge : tout vole devant lui'], [T_IMPACT, '7. L\'impact'], [T_DISPARAIT, '8. Il disparaît en fumée']];

// la forme du serpent : serpent.mjs (le même module sert à l'export pour le jeu)
// ------------------------------------------------------------------ le chemin : la queue enroulée, il se dresse, puis la charge
const PAS_CHEMIN = 0.2;
const CHEMIN = (() => {
  const pts = [];
  const N = 26;
  for (let j = 0; j <= N; j++) {
    const k = j / N, phi = Math.PI / 2 - (1 - k) * 7.6, r = lerp(5.5, 15, k);
    pts.push([r * Math.cos(phi), lerp(1.0, 3.6, k), -21 + r * Math.sin(phi)]);
  }
  pts.push([-4.5, 5.5, -5.5], [-3.5, 11, -4.5], [-1.5, 16.5, -3], [0, 20.2, 0], [0, 21.2, 3.8]);
  const iCou = pts.length;
  pts.push([0, 21, 7]);
  pts.push([0, 17.5, 15], [0, 9.5, 24], [0, 4.2, 34], [2.5, 3.3, 46], [-4.5, 3.3, 61], [4.5, 3.3, 76], [-4.5, 3.3, 91], [3.5, 3.3, 106], [-1.5, 3.3, 119], [0, 3.3, 131], [0, 3.3, 143], [0, 3.3, 160], [0, 3.3, 185]);
  // Catmull-Rom, puis rééchantillonné à pas régulier
  const dense = [];
  const sub_ = 30;
  for (let i = 0; i + 1 < pts.length; i++) {
    const P0 = pts[Math.max(0, i - 1)], P1 = pts[i], P2 = pts[i + 1], P3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let j = 0; j < sub_; j++) {
      const t = j / sub_, t2 = t * t, t3 = t2 * t;
      dense.push([0, 1, 2].map((c) => 0.5 * (2 * P1[c] + (-P0[c] + P2[c]) * t + (2 * P0[c] - 5 * P1[c] + 4 * P2[c] - P3[c]) * t2 + (-P0[c] + 3 * P1[c] - 3 * P2[c] + P3[c]) * t3)));
    }
  }
  dense.push(pts[pts.length - 1]);
  const cum = [0];
  for (let i = 1; i < dense.length; i++) cum.push(cum[i - 1] + Math.hypot(...sub(dense[i], dense[i - 1])));
  const dCou = cum[iCou * sub_], total = cum[cum.length - 1];
  const n = Math.floor(total / PAS_CHEMIN) + 1;
  const P = new Float32Array(n * 3), T = new Float32Array(n * 3), U = new Float32Array(n * 3);
  let j = 0;
  for (let i = 0; i < n; i++) {
    const d = i * PAS_CHEMIN;
    while (j + 2 < cum.length && cum[j + 1] < d) j++;
    const k = clamp((d - cum[j]) / (cum[j + 1] - cum[j]), 0, 1);
    P.set(lerpV(dense[j], dense[j + 1], k), i * 3);
  }
  for (let i = 0; i < n; i++) {
    const a = Math.max(0, i - 2), b = Math.min(n - 1, i + 2);
    const t = norme([P[b * 3] - P[a * 3], P[b * 3 + 1] - P[a * 3 + 1], P[b * 3 + 2] - P[a * 3 + 2]]);
    T.set(t, i * 3);
    // le dos vers le ciel ; quand il se dresse, le ventre regarde vers l'avant
    const v = [0, 1, -0.08];
    U.set(norme(sub(v, mul(t, dot(v, t)))), i * 3);
  }
  // le dos lissé (pas de saut brusque quand il se dresse)
  const U2 = new Float32Array(U);
  for (let i = 0; i < n; i++) {
    let s = [0, 0, 0];
    for (let o = -6; o <= 6; o++) { const q = clamp(i + o, 0, n - 1); s = add(s, [U[q * 3], U[q * 3 + 1], U[q * 3 + 2]]); }
    const t = [T[i * 3], T[i * 3 + 1], T[i * 3 + 2]];
    U2.set(norme(sub(s, mul(t, dot(s, t)))), i * 3);
  }
  const dMin = -dCou;
  let dFin = 0;
  for (let i = Math.round(dCou / PAS_CHEMIN); i < n; i++) if (P[i * 3 + 2] >= 131) { dFin = i * PAS_CHEMIN + dMin; break; }
  return { n, P, T, U: U2, dMin, dFin };
})();
function chemin(d) {
  const f = clamp((d - CHEMIN.dMin) / PAS_CHEMIN, 0, CHEMIN.n - 1.001), i = Math.floor(f), k = f - i;
  const g = (X) => [lerp(X[i * 3], X[i * 3 + 3], k), lerp(X[i * 3 + 1], X[i * 3 + 4], k), lerp(X[i * 3 + 2], X[i * 3 + 5], k)];
  return { p: g(CHEMIN.P), t: norme(g(CHEMIN.T)), u: norme(g(CHEMIN.U)) };
}

// ------------------------------------------------------------------ le mouvement du serpent (fonctions du temps T)
const RAMPE = 0.35, FREIN = 0.7;
const VMAX = CHEMIN.dFin / (DUREE_CHARGE - RAMPE / 2 - FREIN / 2);
function distTete(T) {
  const u = T - T_CHARGE, D = DUREE_CHARGE;
  if (u <= 0) return 0;
  if (u >= D) return CHEMIN.dFin;
  if (u < RAMPE) return (VMAX * u * u) / (2 * RAMPE);
  let d = (VMAX * RAMPE) / 2;
  if (u < D - FREIN) return d + VMAX * (u - RAMPE);
  d += VMAX * (D - FREIN - RAMPE);
  const w = u - (D - FREIN);
  return d + VMAX * (w - (w * w) / (2 * FREIN));
}
const vitesseTete = (T) => (distTete(T + 0.01) - distTete(T - 0.01)) / 0.02;
const ELAN = (T) => cles(T, [[T_ELAN, 0], [T_CHARGE - 0.05, 1], [T_CHARGE + 0.22, 0]]);
const BALANCE = (T) => cles(T, [[T_POUF, 1], [T_ELAN, 1], [T_CHARGE, 0]]);
/** Le décalage de la partie dressée : il se balance en sifflant, puis recule la tête pour prendre son élan. */
function deplacement(s, T) {
  let d = [0, 0, 0];
  const e = ELAN(T);
  if (e > 0 && s < 32) d = add(d, mul([0, 3.5, -8], e * (1 - s / 32) ** 2));
  const b = BALANCE(T);
  if (b > 0 && s < 40) { const g = b * (1 - s / 40) ** 1.5; d = add(d, [Math.sin(T * 1.7 - s * 0.12) * 1.6 * g, Math.sin(T * 1.1 - s * 0.1) * 0.6 * g, 0]); }
  return d;
}
const OUVERTURE = (T) => cles(T, [[T_SIFFLE, 0], [T_SIFFLE + 0.35, 1], [T_SIFFLE + 0.9, 0.85], [T_SIFFLE + 1.2, 0.12], [T_ELAN, 0.12], [T_ELAN + 0.45, 0.8], [T_CHARGE, 1], [T_IMPACT - 0.12, 1], [T_IMPACT + 0.06, 0], [99, 0]]);
const INCLINE = (T) => cles(T, [[T_POUF, 0.1], [T_SIFFLE, -0.22], [T_ELAN, -0.1], [T_CHARGE, 0.45], [T_CHARGE + 0.35, 0], [T_IMPACT, -0.04], [T_IMPACT + 0.1, -0.14], [99, -0.14]]);
const LANGUE_SORT = (T) => (T > T_SIFFLE + 0.1 && T < T_ELAN ? Math.max(0, Math.sin((T - T_SIFFLE) * 7.5)) ** 3 : 0);

/** Le repère de la tête : le cou (p), l'avant (t), le dessus (u), le côté (c), la gueule. */
function cadreTete(T) {
  const d = distTete(T), f = chemin(d), a = INCLINE(T);
  const t = norme(add(mul(f.t, Math.cos(a)), mul(f.u, Math.sin(a))));
  const u = norme(sub(mul(f.u, Math.cos(a)), mul(f.t, Math.sin(a))));

const ANGLE_CRANE = (o) => 0.32 * o, ANGLE_MACH = (o) => -1.0 * o;
/** Un point du crâne (repère de la tête) dans le monde. */
function craneVersMonde(K, q) {
  const a = ANGLE_CRANE(K.ouv), x = q[0] - CHARN, y = q[1];
  const xr = CHARN + x * Math.cos(a) - y * Math.sin(a), yr = x * Math.sin(a) + y * Math.cos(a);
  return add(K.p, add(add(mul(K.t, xr), mul(K.u, yr)), mul(K.c, q[2])));
}
const SIEGE = [6.6, 3.2, 0];

// ------------------------------------------------------------------ la scène
const rendu = new THREE.WebGLRenderer({ antialias: true, stencil: true });
rendu.setPixelRatio(Math.min(devicePixelRatio, 2));
rendu.setSize(innerWidth, innerHeight);
document.body.appendChild(rendu.domElement);
const scene = new THREE.Scene();
const CIEL = new THREE.Color(0x9ec6ea);
scene.background = CIEL;
scene.fog = new THREE.Fog(0x9ec6ea, 110, 330);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1200);
camera.position.set(40, 22, 50);
const controles = new OrbitControls(camera, rendu.domElement);
controles.target.set(0, 10, 20);
controles.enableDamping = true;
const SOLEIL = norme([-0.5, 1, 0.42]);
scene.add(new THREE.HemisphereLight(0xeaf2ff, 0x5a5048, 1.25));
const lumSoleil = new THREE.DirectionalLight(0xfff4e4, 1.9);
lumSoleil.position.set(...mul(SOLEIL, 100));
scene.add(lumSoleil);

// les blocs (terrain, arbres, maison, débris) : un cube, une texture de pixels calculée dans le shader selon le genre
// genres : 0 herbe, 1 terre, 2 pierre, 3 bûche, 4 feuilles, 5 planches, 6 pierres taillées, 7 terre retournée
const matBloc = new THREE.ShaderMaterial({
  uniforms: { soleil: { value: new THREE.Vector3(...SOLEIL) }, ciel: { value: new THREE.Color(0x9ec6ea) } },
  vertexShader: `attribute float genre; varying vec3 vL; varying vec3 vNL; varying vec3 vN; varying float vG; varying float vD; varying float vH;
    void main(){ vec3 sc = vec3(length(instanceMatrix[0].xyz), length(instanceMatrix[1].xyz), length(instanceMatrix[2].xyz));
      vL = (position + 0.5) * sc; vH = sc.y; vNL = normal; vN = normalize(mat3(modelMatrix) * mat3(instanceMatrix) * normal); vG = genre;
      vec4 mv = modelViewMatrix * instanceMatrix * vec4(position, 1.0); vD = -mv.z; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform vec3 soleil; uniform vec3 ciel; varying vec3 vL; varying vec3 vNL; varying vec3 vN; varying float vG; varying float vD; varying float vH;
    float h1(vec3 p){ return fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }
    void main(){
      vec3 q = floor(vL * 8.0 + 0.001); float n = h1(q);
      float haut = step(0.5, vNL.y), bas = step(0.5, -vNL.y), dHaut = vH - vL.y; int g = int(vG + 0.5); vec3 c;
      vec3 terre = vec3(0.53, 0.38, 0.26) * (0.8 + 0.32 * n);
      if (g == 0) { vec3 herbe = vec3(0.40, 0.63, 0.25) * (0.84 + 0.3 * n); c = haut > 0.5 ? herbe : (bas < 0.5 && dHaut < 0.19 + 0.13 * h1(vec3(q.x, 0.0, q.z) + 7.0) ? herbe : terre); }
      else if (g == 1) c = terre;
      else if (g == 2) c = vec3(0.5) * (0.78 + 0.32 * n);
      else if (g == 3) { if (abs(vNL.y) > 0.5) { float r = length(fract(vL.xz) - 0.5); c = vec3(0.64, 0.51, 0.31) * (0.82 + 0.18 * step(0.5, fract(r * 7.0))); } else c = vec3(0.37, 0.27, 0.16) * (0.72 + 0.4 * h1(vec3(q.x + q.z, 0.0, 3.0))); }
      else if (g == 4) c = vec3(0.21, 0.45, 0.15) * (0.55 + 0.65 * n);
      else if (g == 5) { float l = step(0.86, fract(vL.y * 2.0)); c = vec3(0.69, 0.54, 0.33) * (0.88 + 0.15 * n) * (1.0 - 0.32 * l); }
      else if (g == 6) c = vec3(0.47) * (0.62 + 0.55 * h1(floor(vL * 4.0 + 0.001)));
      else c = mix(vec3(0.40, 0.28, 0.19), vec3(0.46), step(0.86, n)) * (0.72 + 0.3 * n);
      float face = haut > 0.5 ? 1.0 : bas > 0.5 ? 0.5 : (abs(vNL.x) > 0.5 ? 0.8 : 0.66);
      vec3 col = pow(c, vec3(2.2)) * (0.5 + 0.7 * max(dot(vN, soleil), 0.0)) * face * 1.12;
      col = mix(col, pow(ciel, vec3(2.2)), clamp((vD - 110.0) / 220.0, 0.0, 1.0));
      gl_FragColor = vec4(col, 1.0); }`,
});
function blocs(n, genres) {
  const g = new THREE.BoxGeometry(1, 1, 1);
  const attr = new THREE.InstancedBufferAttribute(new Float32Array(n), 1);
  attr.setUsage(THREE.DynamicDrawUsage);
  if (genres) attr.array.set(genres);
  g.setAttribute('genre', attr);
  const m = new THREE.InstancedMesh(g, matBloc, n);
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.frustumCulled = false;
  return m;
}

// les ombres : chaque objet aplati sur le sol dans la direction du soleil (le pochoir évite qu'elles se superposent)
const matOmbre = new THREE.MeshBasicMaterial({
  color: 0x1a1426, transparent: true, opacity: 0.34, depthWrite: false,
  stencilWrite: true, stencilRef: 0, stencilFunc: THREE.EqualStencilFunc, stencilZPass: THREE.IncrementStencilOp,
  polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,

const APLATIR = new THREE.Matrix4().set(1, -SOLEIL[0] / SOLEIL[1], 0, (SOLEIL[0] / SOLEIL[1]) * 0.04, 0, 0, 0, 0.04, 0, -SOLEIL[2] / SOLEIL[1], 1, (SOLEIL[2] / SOLEIL[1]) * 0.04, 0, 0, 0, 1);

  const o = new THREE.InstancedMesh(m.geometry, matOmbre, m.count);
  o.instanceMatrix = m.instanceMatrix;
  o.matrixAutoUpdate = false;
  o.frustumCulled = false;
  o.renderOrder = 1;
  scene.add(o);
  ombres.push([o, m]);
  return o;
}

// ------------------------------------------------------------------ le terrain : des colonnes de 4 blocs de haut
const X0 = -50, X1 = 50, Z0 = -50, Z1 = 186, NX = X1 - X0, NZ = Z1 - Z0;
const haut = new Int8Array(NX * NZ), genreSol = new Uint8Array(NX * NZ);
const sol = blocs(NX * NZ);
scene.add(sol);
const m4 = new THREE.Matrix4(), q4 = new THREE.Quaternion(), e4 = new THREE.Euler(), v4 = new THREE.Vector3(), s4 = new THREE.Vector3();
function majColonne(i) {
  m4.makeScale(1, 4, 1).setPosition(X0 + (i % NX) + 0.5, haut[i] - 2, Z0 + Math.floor(i / NX) + 0.5);
  sol.setMatrixAt(i, m4);
  sol.geometry.attributes.genre.array[i] = genreSol[i];
}
const colonne = (x, z) => { const ix = Math.floor(x) - X0, iz = Math.floor(z) - Z0; return ix < 0 || iz < 0 || ix >= NX || iz >= NZ ? -1 : iz * NX + ix; };
const hauteurSol = (x, z) => { const i = colonne(x, z); return i < 0 ? 0 : haut[i]; };
// au-delà, une grande prairie plate (un cadre autour du terrain, pour ne pas couvrir la tranchée)
{
  const mat = new THREE.MeshBasicMaterial({ color: '#70b043' }), L = 700;
  for (const [x0, z0, x1, z1] of [[X0 - L, Z0 - L, X1 + L, Z0], [X0 - L, Z1, X1 + L, Z1 + L], [X0 - L, Z0, X0, Z1], [X1, Z0, X1 + L, Z1]]) {
    const g = new THREE.PlaneGeometry(x1 - x0, z1 - z0);
    g.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(g, mat);
    m.position.set((x0 + x1) / 2, -0.001, (z0 + z1) / 2);
    scene.add(m);
  }
}

// les fissures du sol : une grande image posée sur le terrain
const FIS = document.createElement('canvas');
FIS.width = NX * 8;
FIS.height = NZ * 8;
const fctx = FIS.getContext('2d');
const texFis = new THREE.CanvasTexture(FIS);
texFis.colorSpace = THREE.SRGBColorSpace;
{
  const g = new THREE.PlaneGeometry(NX, NZ);
  g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: texFis, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }));
  m.position.set((X0 + X1) / 2, 0.02, (Z0 + Z1) / 2);
  scene.add(m);
}
let fisChange = false;
function fissure(x, z, dx, dz, long, epais) {
  fctx.strokeStyle = 'rgba(28,16,24,0.92)';
  fctx.lineCap = 'round';
  let px = x, pz = z;
  fctx.lineWidth = epais;
  fctx.beginPath();
  fctx.moveTo((px - X0) * 8, (pz - Z0) * 8);
  for (let l = 0; l < long; l += 0.9) {
    const a = Math.atan2(dz, dx) + al(-0.6, 0.6);
    px += Math.cos(a) * 0.9;

  const J = etatJoueur(T);
  if (J.atterri && evenement(avant - T_DISPARAIT, T - T_DISPARAIT, J.atterri)) {
    for (let i = 0; i < 20; i++) { const a = al(0, 7); fumee.emettre([J.p[0] + Math.cos(a), J.p[1] + 0.3, J.p[2] + Math.sin(a)], [Math.cos(a) * 6, 1, Math.sin(a) * 6], 1.2, 1, 3, 0.5, POUSSIERE, 3); }
  }
  // l'aura violette du marqué
  if (A() < 0.9) { const b = add(J.p, [al(-0.7, 0.7), al(0, 2), al(-0.7, 0.7)]); lueurs.emettre(b, [al(-0.4, 0.4), al(1.5, 3.5), al(-0.4, 0.4)], al(0.5, 1), 0.7, 0.2, 0.7, VIOLET, 0.5); }
  // les cibles qui volent
  for (const c of cibles) {
    if (!c.vol || c.vol.pose) continue;
    c.vol.v[1] -= 32 * dt;
    c.pos = add(c.pos, mul(c.vol.v, dt));
    c.rot = add(c.rot, mul(c.vol.w, dt));
    const fond = hauteurSol(c.pos[0], c.pos[2]);
    if (c.pos[1] < fond && c.vol.v[1] < 0) {
      c.pos[1] = fond;
      c.vol.v = [c.vol.v[0] * 0.4, -c.vol.v[1] * 0.3, c.vol.v[2] * 0.4];
      c.vol.w = mul(c.vol.w, 0.4);
      if (++c.vol.rebonds > 2) { c.vol.pose = true; c.rot = [Math.PI / 2, c.rot[1], 0]; c.pos[1] = fond + 0.25; }
    }
  }
  for (const t of textes) t.age += dt;
  for (const o of ondes) o.age += dt;
  pasDebris(dt);
  fumee.pas(dt);
  lueurs.pas(dt);
}
/** Montre l'image de l'instant T (sans faire avancer la simulation). */
function poser() {
  poserSerpent(T);
  poserJoueur(T);
  for (let i = 0; i < ND; i++) poserDebris(i);
  debris.instanceMatrix.needsUpdate = true;
  debris.geometry.attributes.genre.needsUpdate = true;
  for (const c of cibles) { c.g.position.set(c.pos[0], c.pos[1] + 1.0, c.pos[2]); c.g.rotation.set(...c.rot); }
  for (const t of textes) { t.s.position.set(t.p[0], t.p[1] + t.age * 2.5, t.p[2]); t.s.material.opacity = clamp(2 - t.age, 0, 1); t.s.visible = t.age < 2; }
  for (const o of ondes) { const k = o.age / o.duree; o.m.visible = k < 1; o.m.scale.setScalar(1 + o.rmax * (1 - (1 - Math.min(1, k)) ** 3)); o.m.material.opacity = (1 - k) * 0.9; }
  fumee.maj();
  lueurs.maj();
  if (fisChange) { texFis.needsUpdate = true; fisChange = false; }
  matSceau.uniforms.rayon.value = T < T_POSE ? 0 : 0.5 * lisse((T - T_POSE) / 0.9);
  matSceau.uniforms.force.value = T < T_POUF ? 1 : Math.max(0.25, 1 - (T - T_POUF) / 2.5);
  matSceau.uniforms.temps.value = T;
  scene.updateMatrixWorld();
  for (const [o, m] of ombres) { o.matrix.multiplyMatrices(APLATIR, m.matrixWorld); o.matrixWorld.copy(o.matrix); o.visible = m.visible && (m !== corpsM || serpent.visible) && m.parent.visible !== false && (m === debris || serpent.visible); }
}

// ------------------------------------------------------------------ la caméra « cinéma »
function cameraCinema(T) {
  const K = cadreTete(T);
  const tete = add(K.p, mul(K.t, 8));
  let pos, cible;
  if (T < T_POSE) { const y = etatJoueur(T).p[1]; pos = lerpV([6, 2.2, 9], [4.6, 1.8, 7.6], T / T_POSE); pos[1] += y * 0.6; cible = [0, 1.2 + y, 0]; }
  else if (T < T_POUF) { const k = (T - T_POSE) / (T_POUF - T_POSE); pos = lerpV([3.4, 3.6, 7], [9, 10, 17], lisse(k)); cible = lerpV([0, 0.3, 1.5], [0, 1, 0], k); }
  else if (T < T_ELAN) { const k = (T - T_POUF) / (T_ELAN - T_POUF); pos = lerpV([34, 9, 46], [44, 17, 54], lisse(k)); cible = lerpV([0, 12, -4], [0, 16, 4], lisse(k)); }
  else if (T < T_CHARGE + 0.1) { pos = [30, 20, 34]; cible = lerpV([0, 18, 6], tete, 0.5); }
  else if (T < T_CHARGE + 2.2) { pos = add(tete, [46, 22, -26]); cible = add(tete, [0, 0, 6]); }
  else if (T < T_DISPARAIT + 0.4) { pos = [-44, 13, 170]; cible = lerpV(add(tete, [0, 3, 0]), [0, 4, 148], 0.35); }
  else { const k = (T - T_DISPARAIT - 0.4) / 3; pos = lerpV([34, 13, 178], [38, 46, 190], lisse(k)); cible = lerpV([0, 2, 145], [0, 0, 112], lisse(k)); }
  // la caméra tremble pendant la charge et à l'impact
  const sec = T > T_CHARGE && T < T_IMPACT ? 0.18 : 0, choc = Math.max(0, 1 - Math.abs(T - T_IMPACT) / 0.5) * 0.7 + Math.max(0, 1 - Math.abs(T - T_POUF) / 0.4) * 0.4;
  const a = sec + choc;
  if (a > 0) pos = add(pos, [Math.sin(T * 71) * a, Math.sin(T * 53 + 1) * a, Math.sin(T * 61 + 2) * a]);
  return { pos, cible };
}

// ------------------------------------------------------------------ le rendu : le halo (les yeux, le sceau, l'aura)
const cible2 = new THREE.WebGLRenderTarget(innerWidth * rendu.getPixelRatio(), innerHeight * rendu.getPixelRatio(), { type: THREE.HalfFloatType, stencilBuffer: true });
const composeur = new EffectComposer(rendu, cible2);
composeur.addPass(new RenderPass(scene, camera));
const halo = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.45, 0.9);
composeur.addPass(halo);
composeur.addPass(new OutputPass());
function majEchelle(h) { const e = h / 2 / Math.tan((camera.fov * Math.PI) / 360); fumee.mat.uniforms.echelle.value = lueurs.mat.uniforms.echelle.value = e; }
majEchelle(innerHeight * rendu.getPixelRatio());

// ------------------------------------------------------------------ les boutons
const reglages = { lecture: true, vitesse: 1, cinema: true, pas: 0.25, boucle: true };
const ui = document.getElementById('ui');
function bouton(texte, action, actif) {
  const b = document.createElement('button');
  b.textContent = texte;
  const maj = () => actif && b.classList.toggle('on', actif());
  b.onclick = () => { action(); for (const f of majs) f(); };
  majs.push(maj);
  maj();
  ui.appendChild(b);
  return b;
}
const majs = [];
const etiquette = (t) => { const s = document.createElement('span'); s.textContent = t; ui.appendChild(s); };
bouton('↺ Rejouer', () => { reinitialiser(); reglages.lecture = true; });
bouton('Pause', () => (reglages.lecture = !reglages.lecture), () => !reglages.lecture);
etiquette('Vitesse');
for (const v of [1, 0.5, 0.25]) bouton('×' + v, () => (reglages.vitesse = v), () => reglages.vitesse === v);
etiquette('Caméra');
bouton('Cinéma', () => (reglages.cinema = true), () => reglages.cinema);
bouton('Libre', () => { reglages.cinema = false; }, () => !reglages.cinema);
etiquette('Cubes');
bouton('¼ de bloc', () => { reglages.pas = 0.25; refaire(); }, () => reglages.pas === 0.25);
bouton('½ bloc', () => { reglages.pas = 0.5; refaire(); }, () => reglages.pas === 0.5);
etiquette('Planche');
bouton('Faire la planche', () => planche());
const curseur = document.getElementById('curseur'), phase = document.getElementById('phase');
curseur.max = T_FIN;
curseur.onchange = () => { aller(+curseur.value); reglages.lecture = false; for (const f of majs) f(); };
function refaire() {
  document.getElementById('charge').style.display = 'grid';
  setTimeout(() => { monterSerpent(reglages.pas); document.getElementById('charge').style.display = 'none'; }, 30);
}
/** Va à l'instant t : on rejoue tout depuis le début, à pas fixe. */
function aller(t) {
  reinitialiser();
  while (T < t - 1e-6) pas(Math.min(1 / 60, t - T));
  poser();
}

// ------------------------------------------------------------------ la planche (les maquettes)
const VIGNETTES = [
  [0.62, '1. Le saut', 'Il saute en l\'air, l\'aura violette autour de lui.'],
  [1.45, '2. Les mains au sol', 'Il plaque les deux mains : le sceau d\'invocation s\'étale, noir et violet.'],
  [2.55, '3. Pouf !', 'Une énorme fumée blanche, l\'onde de choc fait voler les blocs autour.'],
  [3.45, '4. Le serpent géant', 'Le grand serpent violet se dresse, lui debout sur la tête. Il siffle.'],
  [4.92, '5. L\'élan', 'La tête recule, la gueule s\'ouvre en grand.'],
  [6.6, '6. La charge', 'Il fonce droit devant, gueule ouverte, sur 130 blocs : les blocs volent.'],
  [8.5, '7. Tout y passe', 'Arbres, joueurs, maisons : tout ce qui est devant vole en l\'air.'],
  [T_IMPACT + 0.25, '8. L\'impact', 'Gros choc à la fin, une gerbe de blocs, puis il disparaît en fumée.'],
];
async function planche() {
  const L = 720, H = 405, M = 22, cols = 4;
  const W = cols * L + (cols + 1) * M, HT = 130, HL = H + 84, HS = 330;
  const can = document.createElement('canvas');
  can.width = W;
  can.height = HT + 2 * HL + M + HS + M;
  const x = can.getContext('2d');
  x.fillStyle = '#17131f';
  x.fillRect(0, 0, can.width, can.height);
  const ancien = { lecture: reglages.lecture, cinema: reglages.cinema, w: innerWidth, h: innerHeight, pr: rendu.getPixelRatio() };
  reglages.lecture = false;
  rendu.setPixelRatio(1);
  rendu.setSize(L, H, false);
  composeur.setPixelRatio(1);
  composeur.setSize(L, H);
  camera.aspect = L / H;
  camera.updateProjectionMatrix();
  majEchelle(H);
  for (let n = 0; n < VIGNETTES.length; n++) {
    const [t, titre, texte] = VIGNETTES[n];
    aller(t);
    const c = cameraCinema(t);
    camera.position.set(...c.pos);
    camera.lookAt(...c.cible);
    composeur.render();
    const cx = M + (n % cols) * (L + M), cy = HT + Math.floor(n / cols) * HL;
    x.drawImage(rendu.domElement, cx, cy, L, H);
    x.strokeStyle = '#6b3d96';
    x.lineWidth = 3;
    x.strokeRect(cx, cy, L, H);
    x.fillStyle = '#e9d8ff';
    x.font = 'bold 30px system-ui';
    x.fillText(titre, cx, cy + H + 36);
    x.fillStyle = '#b8a9c9';
    x.font = '21px system-ui';
    x.fillText(texte, cx, cy + H + 66);
    await new Promise((r) => setTimeout(r, 20));
  }
  x.fillStyle = '#f2e8ff';
  x.font = 'bold 54px system-ui';
  x.fillText('Marque maudite 3 — l\'ulti : l\'invocation du serpent géant', M, 72);
  x.fillStyle = '#b8a9c9';
  x.font = '26px system-ui';
  x.fillText('Touche J, une fois par forme niveau 3 · serpent violet de 117 blocs (tête 17 blocs, corps 10 blocs de large), en cubes de ¼ de bloc', M, 112);
  const sy = HT + 2 * HL + M;
  x.fillStyle = '#221b2e';
  x.fillRect(M, sy, W - 2 * M, HS);
  x.fillStyle = '#e9d8ff';
  x.font = 'bold 32px system-ui';
  x.fillText('Ce que je propose (à valider)', M + 24, sy + 48);
  x.font = '24px system-ui';
  x.fillStyle = '#d8cce6';
  const lignes = [
    'Lancement : 1 s (saut, mains au sol, sceau). Le serpent apparaît là où il regarde, lui debout sur la tête ; il reste dessus pendant la charge.',
    'Charge : 4 s, en ligne droite (elle suit un peu la visée), environ 130 blocs, gueule ouverte.',
    'Dégâts : la tête 28 + envoyé en l\'air · le souffle sur les côtés (6 blocs) 12 + repoussé · l\'impact final 18 sur 9 blocs. Chacun est touché une seule fois par la charge.',
    'Le sol : rien n’est cassé. Les blocs qui volent sont des copies (un effet), elles retombent et disparaissent ; la map et le village restent intacts.',
    'Recharge : une fois par forme niveau 3, puis 5 min. Il prend les coups comme un joueur normal pendant l\'ulti (pas de contre-pouvoir).',
    'Fin : le serpent disparaît dans un pouf de fumée, il retombe au sol sans dégâts de chute.',
  ];
  lignes.forEach((l, i) => x.fillText('• ' + l, M + 24, sy + 96 + i * 38));
  // on remet l'écran comme avant
  rendu.setPixelRatio(ancien.pr);
  rendu.setSize(innerWidth, innerHeight);
  composeur.setPixelRatio(ancien.pr);
  composeur.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  majEchelle(innerHeight * ancien.pr);
  reglages.lecture = ancien.lecture;
  const blob = await new Promise((r) => can.toBlob(r, 'image/png'));
  const rep = await fetch('/enregistrer?nom=planche-ulti.png', { method: 'POST', body: blob });
  console.log('planche', rep.status);
  return rep.status;
}

// ------------------------------------------------------------------ la boucle
const horloge = new THREE.Clock();
function image() {
  requestAnimationFrame(image);
  const dt = Math.min(0.05, horloge.getDelta());
  if (reglages.lecture) {
    let reste = dt * reglages.vitesse;
    while (reste > 1e-6) { const d = Math.min(1 / 60, reste); pas(d); reste -= d; }
    if (T > T_FIN) { if (reglages.boucle) reinitialiser(); else reglages.lecture = false; }
  }
  poser();
  if (reglages.cinema) {
    const c = cameraCinema(T);
    camera.position.set(...c.pos);
    camera.lookAt(...c.cible);
    controles.target.set(...c.cible);
  } else controles.update();
  const flash = Math.max(0, 1 - Math.abs(T - T_POUF - 0.05) / 0.3) + Math.max(0, 1 - Math.abs(T - T_IMPACT) / 0.3) * 0.6;
  halo.strength = 0.5 + 1.2 * flash;
  curseur.value = T;
  phase.textContent = PHASES.filter(([t]) => T >= t).pop()[1];
  composeur.render();
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  rendu.setSize(innerWidth, innerHeight);
  composeur.setSize(innerWidth, innerHeight);
  majEchelle(innerHeight * rendu.getPixelRatio());
});
monterSerpent(reglages.pas);
reinitialiser();
document.getElementById('charge').style.display = 'none';
image();
window.apercu = {
  aller: (t) => { reglages.lecture = false; aller(t); for (const f of majs) f(); },
  // pour les captures : va à t et dessine tout de suite (même si l'onglet est en arrière-plan)
  rendre: (t, pos, cible) => {
    reglages.lecture = false;
    aller(t);
    const c = cameraCinema(t);
    camera.position.set(...(pos ?? c.pos));
    camera.lookAt(...(cible ?? c.cible));
    if (pos) { reglages.cinema = false; controles.target.set(...cible); }
    composeur.render();
    for (const f of majs) f();
  },
  // une capture enregistrée dans ulti/ (marche même quand le panneau est caché) ; sansFumee pour voir à travers
  photo: async (t, nom, pos, cible, sansFumee) => {
    fumee.pts.visible = !sansFumee;
    window.apercu.rendre(t, pos, cible);
    const blob = await new Promise((r) => rendu.domElement.toBlob(r, 'image/png'));
    fumee.pts.visible = true;
    return (await fetch('/enregistrer?nom=' + nom + '.png', { method: 'POST', body: blob })).status;
  },
  jouer: () => { reglages.lecture = true; },
  libre: (pos, cible) => { reglages.cinema = false; camera.position.set(...pos); controles.target.set(...cible); controles.update(); for (const f of majs) f(); },
  // le sceau pour le mod (512 px) : enregistré dans ulti/sceau.png, à copier dans assets/cabane/textures/marque/
  sceau: async () => {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    c.getContext('2d').drawImage(SCEAU, 0, 0, 512, 512);
    const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
    return (await fetch('/enregistrer?nom=sceau.png', { method: 'POST', body: blob })).status;
  },
  planche, reglages, cadreTete, CHEMIN,
};
</script>
