<script type="module">
// Le dragon du niveau 3 des fruits, chevauché : la même tête que dans le jeu (fruit3/tete_*.bin), le même corps
// d'anneaux et la même crête (ClientFruit3.serpent), en plus long. Clic droit : il sort de la main et le joueur monte
// dessus ; il vole 30 s au plus, à la vitesse du vol du Vent 3 ; clic droit sur quelqu'un : la gueule l'attrape ;
// clic droit dans le vide : il fonce et explose ; au bout des 30 s, il explose en l'air.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ================================================================ outils
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const rgb = (r, g, b) => [r / 255, g / 255, b / 255];

  CHAUD = rgb(255, 250, 214), GLACE = rgb(146, 206, 244), GLACE_C = rgb(214, 240, 255), BLANCHE = rgb(248, 252, 255), GLACE_P = rgb(90, 156, 224),
  GLACE_V = rgb(120, 236, 255), FUMEE = rgb(128, 122, 120);
const borne = (u) => Math.max(0, Math.min(1, u));

const versLin = (c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);

/** Un lot de faces qu'on refait à chaque image (le corps, les flammes, les éclats). */
class Lot {
  constructor(materiau, cap) {

    this.g = new THREE.BufferGeometry();

      this.g.setAttribute(nom, new THREE.BufferAttribute(tab, t).setUsage(THREE.DynamicDrawUsage));

  quad(a, b, c, d, col, al = 1, n = null) {

    const r = versLin(col[0]), g = versLin(col[1]), bl = versLin(col[2]);

      this.n[o] = n.x; this.n[o + 1] = n.y; this.n[o + 2] = n.z;

  /** Une pointe à quatre faces (GrandeFleche.pic) : la couleur « pied » au pied, « bout » à la cime. */
  pic(base, dir, longueur, largeur, pied, bout) {

    const e1 = Math.abs(d.y) < 0.9 ? d.clone().cross(V(0, 1, 0)).normalize() : d.clone().cross(V(1, 0, 0)).normalize();
    const e2 = d.clone().cross(e1).normalize();

    for (let i = 0; i < 4; i++) {
      const k = 0.85 + 0.15 * (i % 2);
      this.tri(coins[i], coins[(i + 1) % 4], cime, pied.map((x, j) => (j < 3 ? x * k : x)), bout);
    }
  }
  tri(a, b, c, ca, cb) {
    if (this.k >= this.cap) return;

    const n = new THREE.Vector3().subVectors(b, a).cross(new THREE.Vector3().subVectors(c, a)).normalize();
    const pts = [[a, ca], [b, ca], [c, cb], [a, ca], [a, ca], [a, ca]];
    for (const [q, col] of pts) {
      this.p[o] = q.x; this.p[o + 1] = q.y; this.p[o + 2] = q.z;
      this.n[o] = n.x; this.n[o + 1] = n.y; this.n[o + 2] = n.z;

  cube(o, s, angle, col, al = 1) {

  boite(o, x, y, z, teinte, al = 1, ombre = true) {

    this.g.setDrawRange(0, this.k * 6);

  }

// ================================================================ la scène
const rendu = new THREE.WebGLRenderer({ antialias: true });
rendu.setPixelRatio(Math.min(2, devicePixelRatio));
rendu.setSize(innerWidth, innerHeight);
document.body.appendChild(rendu.domElement);
const scene = new THREE.Scene();
const CIEL = new THREE.Color(0x86b4f4);
scene.background = CIEL;
scene.fog = new THREE.Fog(CIEL, 90, 260);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 600);
const controles = new OrbitControls(camera, rendu.domElement);
controles.enableDamping = true;
controles.enabled = false;
scene.add(new THREE.HemisphereLight(0xdcecff, 0x6f8a52, 1.6));
const soleil = new THREE.DirectionalLight(0xfff4e0, 1.6);
soleil.position.set(40, 80, 25);
scene.add(soleil);

const composeur = new EffectComposer(rendu);
composeur.addPass(new RenderPass(scene, camera));
const lueur = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.45, 0.5, 0.82);
composeur.addPass(lueur);
composeur.addPass(new OutputPass());
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  rendu.setSize(innerWidth, innerHeight); composeur.setSize(innerWidth, innerHeight);
});

// ---------------------------------------------------------------- le terrain : de l'herbe, des arbres, une tour
function texturePixels(n, f) {
  const cv = document.createElement('canvas'); cv.width = cv.height = n;
  const g = cv.getContext('2d');
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const c = f(i, j); g.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`; g.fillRect(i, j, 1, 1); }
  const t = new THREE.CanvasTexture(cv); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestMipmapNearestFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}
const herbe = texturePixels(16, (i, j) => { const h = hache(i, j, 1); return [86 + h * 30, 140 + h * 36, 58 + h * 20]; });
herbe.repeat.set(400, 400);
const sol = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ map: herbe }));
sol.rotation.x = -Math.PI / 2;
scene.add(sol);
const pierre = texturePixels(16, (i, j) => { const h = hache(i, j, 2); const v = 110 + h * 40 - ((i % 8 === 0 || j % 5 === 0) ? 25 : 0); return [v, v, v + 4]; });
const tronc = texturePixels(16, (i, j) => { const h = hache(i, j, 3); return [96 + h * 20 - (i % 4 === 0 ? 20 : 0), 72 + h * 14, 44]; });
const feuilles = texturePixels(16, (i, j) => { const h = hache(i, j, 4); return h < 0.15 ? [40, 80, 30] : [52 + h * 40, 110 + h * 50, 40]; });
function blocs(tex, x0, y0, z0, x1, y1, z1) {
  const t = tex.clone(); t.needsUpdate = true;
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), new THREE.MeshLambertMaterial({ map: t }));
  // une texture par bloc : on recouvre chaque face autant de fois qu'elle a de blocs
  const uv = m.geometry.attributes.uv, pos = m.geometry.attributes.position, nor = m.geometry.attributes.normal;
  for (let i = 0; i < uv.count; i++) {
    const p = [pos.getX(i) + (x1 - x0) / 2, pos.getY(i) + (y1 - y0) / 2, pos.getZ(i) + (z1 - z0) / 2], n = [nor.getX(i), nor.getY(i), nor.getZ(i)];
    const ax = Math.abs(n[0]) > 0.5 ? [2, 1] : Math.abs(n[1]) > 0.5 ? [0, 2] : [0, 1];
    uv.setXY(i, p[ax[0]], p[ax[1]]);
  }
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  scene.add(m);
}
function arbre(x, z, h) {
  blocs(tronc, x, 0, z, x + 1, h, z + 1);
  blocs(feuilles, x - 2, h - 2, z - 2, x + 3, h, z + 3);
  blocs(feuilles, x - 1, h, z - 1, x + 2, h + 1.5, z + 2);
}
const TOUR = { x: 28, z: -10, h: 8 };
blocs(pierre, TOUR.x - 1.5, 0, TOUR.z - 1.5, TOUR.x + 1.5, TOUR.h, TOUR.z + 1.5);
for (const [x, z, h] of [[-9, 6, 5], [8, -6, 6], [-4, 24, 5], [18, 12, 6], [40, -2, 5], [-28, 22, 6], [-8, -18, 5], [12, 36, 6], [44, 26, 5], [-30, -4, 6], [22, -28, 5], [-14, 40, 6], [52, 8, 6]]) arbre(x, z, h);
const hauteurSol = (x, z) => (Math.abs(x - TOUR.x) < 1.6 && Math.abs(z - TOUR.z) < 1.6 ? TOUR.h : 0);

// ================================================================ les modèles du jeu
function lireBin(nom) {
  const s = atob(window.BINS[nom]); const u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  const dv = new DataView(u.buffer); let o = 0;
  const groupes = [];
  for (let g = dv.getInt32(o), gi = (o += 4, 0); gi < g; gi++) {
    const n = dv.getInt32(o); o += 4; const faces = [];
    for (let f = 0; f < n; f++) {
      const c = []; for (let k = 0; k < 12; k++) { c.push(dv.getFloat32(o)); o += 4; }

      faces.push({ c, n: nn, col: [u[o] / 255, u[o + 1] / 255, u[o + 2] / 255], em: u[o + 3] !== 0 }); o += 4;

/** Les faces d'un modèle en géométrie ; f change chaque point (le repère du jeu vers celui-ci) ; em : celles qui brillent ou les autres. */
function geometrie(faces, f, em) {
  const p = [], n = [], c = [];

    const q = [0, 1, 2, 3].map((i) => f(V(x.c[i * 3], x.c[i * 3 + 1], x.c[i * 3 + 2])));
    const nn = f(V(x.n[0], x.n[1], x.n[2]), true).normalize();

const MAT = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });

function modele(faces, f) {

const MODELES = {};
for (const s of ['lave', 'glace']) {
  MODELES['tete_' + s] = lireBin('tete_' + s)[0];
  MODELES['casque_' + s] = lireBin('casque_' + s)[0];
  MODELES['plaques_' + s] = lireBin('plaques_' + s + '_0');
}

// ---------------------------------------------------------------- les joueurs (en pixels, comme PlayerModel)
const PEAU = rgb(196, 138, 102), CHEVEUX = rgb(62, 42, 26);
const SORTES = {
  lave: (partie, f, i, j) => {
    if (partie === 'tete' && f === 4 && (j === 3 || j === 4)) return (j === 3 && (i === 1 || i === 6)) ? [1, 1, 1] : (j === 3 && (i === 2 || i === 5)) ? rgb(30, 20, 20) : PEAU;
    if (partie === 'brasD' && j >= 7) return PEAU;
    const h = hache(i * 3 + f, j * 7, partie.length * 31);
    return h < 0.22 ? { c: mix(LAVE_O, LAVE_J, h / 0.22), lueur: true } : h < 0.3 ? { c: LAVE_R, lueur: true } : mix(CROUTE, CROUTE_R, hache(i, j, f + 9));
  },
  glace: (partie, f, i, j) => {
    if (partie === 'tete' && f === 4 && (j === 3 || j === 4)) return (j === 3 && (i === 1 || i === 6)) ? [1, 1, 1] : (j === 3 && (i === 2 || i === 5)) ? rgb(30, 40, 70) : PEAU;
    if (partie === 'brasG' && j >= 7) return PEAU;
    const h = hache(i * 3 + f, j * 7, partie.length * 37);
    return (i + j) % 5 === 0 ? BLANCHE : mix(mix(GLACE_C, GLACE, 0.4 + 0.5 * h), GLACE_P, 0.3);
  },
  steve: (partie, f, i, j, n = 0) => {
    const chemises = [rgb(0, 160, 170), rgb(200, 60, 60), rgb(120, 70, 160), rgb(230, 180, 40)];
    if (partie === 'tete') {
      if (f === 0 || (f !== 1 && j < 2) || (f === 5 && j < 6)) return CHEVEUX;
      if (f === 4 && j === 4 && (i === 1 || i === 2 || i === 5 || i === 6)) return (i === 1 || i === 6) ? [1, 1, 1] : rgb(60, 70, 160);
      if (f === 4 && j === 6 && i >= 3 && i <= 4) return rgb(120, 70, 50);
      return PEAU;
    }
    if (partie === 'corps') return chemises[n % 4];
    if (partie.startsWith('bras')) return j < 4 ? chemises[n % 4] : PEAU;
    return j >= 10 ? rgb(90, 90, 96) : rgb(50, 60, 150);
  },

/** Les parties : pivot (px, y vers le haut, l'avant vers +z) et la boîte autour du pivot. */
const PARTIES = {
  tete: { pivot: [0, 24, 0], boite: [-4, 0, -4, 4, 8, 4] },
  corps: { pivot: [0, 24, 0], boite: [-4, -12, -2, 4, 0, 2] },
  brasD: { pivot: [-5, 22, 0], boite: [-3, -10, -2, 1, 2, 2] },
  brasG: { pivot: [5, 22, 0], boite: [-1, -10, -2, 3, 2, 2] },
  jambeD: { pivot: [-1.9, 12, 0], boite: [-2, -12, -2, 2, 0, 2] },
  jambeG: { pivot: [1.9, 12, 0], boite: [-2, -12, -2, 2, 0, 2] },

const ORDRE = ['tete', 'corps', 'brasD', 'brasG', 'jambeD', 'jambeG'];
function boitePixels(b, teinte) {
  const [x0, y0, z0, x1, y1, z1] = b;
  // les faces : 0 haut, 1 bas, 2 droite (-x), 3 gauche (+x), 4 devant (+z), 5 derrière ; i de gauche à droite, j de haut en bas
  const F = [
    { o: [x0, y1, z1], u: [1, 0, 0], v: [0, 0, -1], nu: x1 - x0, nv: z1 - z0, n: [0, 1, 0] },
    { o: [x0, y0, z0], u: [1, 0, 0], v: [0, 0, 1], nu: x1 - x0, nv: z1 - z0, n: [0, -1, 0] },
    { o: [x0, y1, z0], u: [0, 0, 1], v: [0, -1, 0], nu: z1 - z0, nv: y1 - y0, n: [-1, 0, 0] },
    { o: [x1, y1, z1], u: [0, 0, -1], v: [0, -1, 0], nu: z1 - z0, nv: y1 - y0, n: [1, 0, 0] },

    }

        p.clone().add(V(Math.cos(a + 0.18) * anneauR * 0.8, 0, Math.sin(a + 0.18) * anneauR * 0.8)), p.clone().add(V(Math.cos(a) * anneauR * 0.8, 0, Math.sin(a) * anneauR * 0.8)), GLACE_C, 0.6 * fin);
    }
  } else {
    for (let q = 0; q < 220; q++) {
      const d = V(hache(q, 1, 391) - 0.5, hache(q, 2, 391) - 0.5, hache(q, 3, 391) - 0.5).normalize();
      const k = Math.cbrt(hache(q, 4, 391));
      pleinLot.cube(p.clone().addScaledVector(d, 2.9 * k * g * E), (0.22 + 0.15 * hache(q, 5, 391)) * fin * E, q, feu(k * 0.8 + 0.4 * entre(age, 0.3, 1.8)));
    }
    const s = age * 1.2;
    for (let q = 0; q < 40; q++) {
      const a = hache(q, 1, 393) * Math.PI * 2, vit = 6 + 6 * hache(q, 2, 393), up = 5 + 6 * hache(q, 3, 393);
      pleinLot.cube(p.clone().add(V(Math.cos(a) * vit * s * E, (up * s - 9 * s * s) * E, Math.sin(a) * vit * s * E)), 0.22 * fin, q + age * 4, hache(q, 4, 393) < 0.5 ? LAVE_O : CROUTE_R);
    }
    for (let q = 0; q < 30; q++) {
      const d = V(hache(q, 2, 394) - 0.5, hache(q, 3, 394) - 0.5, hache(q, 4, 394) - 0.5).normalize();
      flamme(p.clone().addScaledVector(d, 2.4 * g * E), d, (1 + 1.2 * hache(q, 5, 394)) * fin * g * E, 0.45 * E);
    }
    // de la fumée qui monte
    for (let q = 0; q < 30; q++) {
      const d = V(hache(q, 1, 396) - 0.5, hache(q, 2, 396) * 0.5, hache(q, 3, 396) - 0.5).normalize(), a = entre(age, 0.4, 2.2);
      voileLot.cube(p.clone().addScaledVector(d, 4 * a * E).add(V(0, 3 * a, 0)), (0.5 + 0.9 * a) * E, q, FUMEE, 0.5 * (1 - a));
    }
  }
}
const flash = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 2), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false }));
flash.renderOrder = 3; flash.visible = false; scene.add(flash);
function particules(dt, pts, glace) {
  if (pts && !pause) {
    for (let q = 0; q < 2; q++) {
      const i = Math.floor(Math.random() * pts.length), r = rayon(i / pts.length, true);
      const d = V(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
      BRAISES.push({ p: pts[i].clone().addScaledVector(d, r), v: d.multiplyScalar(0.6).add(V(0, glace ? -0.5 : 1.2, 0)), vie: 0, max: 0.8 + Math.random(),
        c: glace ? (Math.random() < 0.5 ? BLANCHE : GLACE_V) : (Math.random() < 0.5 ? LAVE_J : LAVE_O), s: 0.035 + Math.random() * 0.04 });
    }
  }
  for (const l of [BRAISES, DEBRIS]) {
    for (let i = l.length - 1; i >= 0; i--) {
      const b = l[i];
      if (!pause) { b.vie += dt; b.p.addScaledVector(b.v, dt); if (b.g) b.v.y -= b.g * dt; if (b.p.y < 0.1) { b.p.y = 0.1; b.v.multiplyScalar(0.4); } }
      if (b.vie > b.max) { l.splice(i, 1); continue; }
      pleinLot.cube(b.p, b.s * (1 - b.vie / b.max * 0.5), b.vie * 3 + i, b.c);
    }
  }
}

// ================================================================ l'animation
let tSuiv = null;
const camPos = V(-8, 6, -10), camVise = V(0, 2, 0);
function libre() {
  controles.enabled = true;
  controles.target.copy(camVise);
}
const legende = document.getElementById('legende'), minuteur = document.getElementById('minuteur'), chrono = document.getElementById('chrono');

function image(dt) {
  const def = SCENES[nomScene];
  if (!pause) t += dt;
  corpsLot.vider(); pleinLot.vider(); voileLot.vider();
  flash.visible = false;
  const glace = sorte === 'glace';
  const tFin = def.pose ? Infinity : tr.tFin;
  const s = sA(tr, Math.min(t, tr.tFin));
  let T = null, pts = null, texte = '';
  const L = ACTEURS.lanceur, Vi = ACTEURS.victime;
  const joueurP = def.joueur ? V(...def.joueur) : null;

  if (t < tFin) {
    pts = colonne(tr, s);
    T = serpent(pts, glace, t, def.pose || def.deja || (tr.tMonte >= 0 && t >= tr.tMonte - 0.35));
  } else {
    for (const x of Object.values(TETES)) x.visible = false;
    if (!explose) {
      // il explose : là où il est (fin des 30 s), ou au bout de sa course (il a foncé)
      const sF = sA(tr, tr.tFin), fT = teteA(tr, sF);
      explose = { p: tr.impact ? tr.impact.clone() : fT.o.clone(), sol: tr.impact, debut: tr.tFin, selle: selle(tr, sF), gueule: gueule(fT) };
      const corpsFin = colonne(tr, sF);
      for (const [i, p] of corpsFin.entries()) {
        for (let q = 0; q < 2; q++) {
          const d = V(Math.random() - 0.5, Math.random() * 0.8, Math.random() - 0.5).normalize();
          DEBRIS.push({ p: p.clone(), v: d.multiplyScalar(4 + Math.random() * 6), g: 14, vie: 0, max: 1.4 + Math.random(), s: 0.18 + Math.random() * 0.14,
            c: glace ? (q % 2 ? GLACE : BLANCHE) : (q % 2 ? CROUTE : LAVE_O) });
        }
      }
    }
  }
  const age = explose ? t - explose.debut : -1;
  if (explose) eclatement(explose.p, age, glace, explose.sol);

  // ---- celui qui a le fruit
  if (L) {
    if (def.pose || (tr.tMonte >= 0 && t >= tr.tMonte) || def.deja) {
      if (!explose) {
        const sl = selle(tr, s), k = def.deja ? 1 : sortie(entre(t, tr.tMonte - 0.35, tr.tMonte));
        const p = joueurP && k < 1 ? joueurP.clone().lerp(sl.p, k).add(V(0, Math.sin(k * Math.PI) * 1.5, 0)) : sl.p;
        placer(L, p, sl.f, k < 1 ? V(0, 1, 0).lerp(sl.y, k) : sl.y);
        poser(L, 'monte');
      } else {
        // éjecté vers le haut, puis il redescend doucement, sans dégâts de chute
        const a = Math.min(age, 0.6), p0 = explose.selle.p;
        const montee = 8 * a - 6.6 * a * a, recul = explose.selle.f.clone().setY(0).normalize().multiplyScalar(-5 * a);
        let y = p0.y + montee - Math.max(0, age - 0.6) * 2.6;
        const p = p0.clone().add(recul); p.y = Math.max(hauteurSol(p.x, p.z), y);
        const sur = p.y <= hauteurSol(p.x, p.z) + 0.01;
        placer(L, p, explose.selle.f.clone().setY(0));
        poser(L, sur ? null : 'chute', t);
        if (!sur && Math.random() < 0.4 && !pause) BRAISES.push({ p: p.clone().add(V(Math.random() - 0.5, 0, Math.random() - 0.5)), v: V(0, 0.4, 0), vie: 0, max: 0.6, c: [1, 1, 1], s: 0.05 });
      }
    } else {
      placer(L, joueurP, V(0, 0, 1));
      poser(L, t < 0.6 ? 'lance' : null);
    }
  }
  // ---- la victime
  if (Vi) {
    const pris = tr.tPrise != null && (tr.tPrise < 0 || t >= tr.tPrise);
    if (pris && !explose && T) {
      const g = gueule(T), k = tr.tPrise < 0 ? 1 : sortie(entre(t, tr.tPrise, tr.tPrise + 0.15));
      // en travers de la gueule : sa tête d'un côté, ses pieds de l'autre
      const pied = g.clone().addScaledVector(T.x, -0.95);
      const debut = def.victime ? V(...def.victime) : pied;
      placer(Vi, debut.clone().lerp(pied, k), T.y.clone().negate().lerp(V(0, 0, 1), 1 - k), V(0, 1, 0).lerp(T.x, k));
      poser(Vi, 'pris', t);
      if (!touches.has('prise') && tr.tPrise >= 0) { touches.add('prise'); chiffre(g.clone().add(V(0, 2, 0)), '−6', glace ? '#bfe8ff' : '#ffb060'); }
    } else if (pris && explose) {
      const a = age, g0 = explose.gueule;
      const p = g0.clone().add(V(-3 * a, 7 * a - 10 * a * a, 2 * a));
      const sol = hauteurSol(p.x, p.z);
      if (p.y <= sol) p.y = sol;
      const auSol = p.y <= sol + 0.01;
      placer(Vi, p, V(0, 0, 1), auSol ? V(1, 0, 0) : V(Math.sin(a * 6), Math.cos(a * 6), 0));
      poser(Vi, auSol ? 'couche' : 'chute', t);
      if (!touches.has('victime')) { touches.add('victime'); chiffre(g0.clone().add(V(0, 2.5, 0)), '−24', glace ? '#bfe8ff' : '#ffb060'); }
      if (glace && age < 4.5) pleinLot.boite(p.clone().add(auSol ? V(0, 0.4, 0) : V(0, 0.9, 0)), V(auSol ? 1.1 : 0.6, 0, 0), V(0, auSol ? 0.45 : 1.1, 0), V(0, 0, 0.6), () => GLACE_C, 1);
    } else {
      placer(Vi, V(...def.victime), V(-1, 0, 0.4));
      poser(Vi, null);
    }
  }
  // ---- le groupe en bas, qui se prend l'explosion
  ACTEURS.groupe.forEach((G, i) => {
    const p0 = V(...def.groupe[i]);
    if (explose && def.fin === 'impact') {
      const dehors = p0.clone().sub(explose.p).setY(0).normalize(), a = Math.min(age, 0.7);
      const p = p0.clone().addScaledVector(dehors, 5 * a).add(V(0, Math.max(0, 5 * a - 7 * a * a), 0));
      placer(G, p, dehors.clone().negate(), age < 0.7 ? V(0, 1, 0).addScaledVector(dehors, 0.5) : V(0, 1, 0));
      poser(G, age < 0.7 ? 'chute' : null, t);
      if (!touches.has('g' + i)) { touches.add('g' + i); chiffre(p0.clone().add(V(0, 2.6 + i * 0.5, 0)), '−' + [17, 15, 19][i], glace ? '#bfe8ff' : '#ffb060'); }
      if (glace && age < 4.5) pleinLot.boite(p.clone().add(V(0, 0.95, 0)), V(0.6, 0, 0), V(0, 1.1, 0), V(0, 0, 0.6), () => GLACE_C, 1);
    } else {
      placer(G, p0, explose ? V(0, 0, 1) : V(Math.sin(t + i), 0, Math.cos(t + i)).add(V(1, 0, -1)));
      poser(G, null);
    }
  });
  particules(dt, explose ? null : pts, glace);
  for (const c of CHIFFRES) {
    const a = t - c.debut;
    c.sprite.position.copy(c.p).add(V(0, a * 0.8, 0));
    c.sprite.material.opacity = 1 - entre(a, 1.6, 2.4);
  }
  corpsLot.fin(); pleinLot.fin(); voileLot.fin();

  // ---- ce qu'il se passe, en mots
  const volDebut = def.deja ? 30 - (tr.tFin - tr.t0) : 0;
  let vol = null;
  if (def.pose) texte = 'Le dragon, plus long (' + LONGUEUR + ' blocs) — il est monté sur sa nuque';
  else if (explose) {
    texte = def.fin === 'impact' ? 'Il s\'écrase et explose : la victime et ceux autour prennent tout' : '30 s : il explose en l\'air, la victime prend tout';
    if (age > 1.5) texte = 'Il est éjecté et redescend doucement, sans dégâts de chute';
  } else if (!def.deja && t < tr.tMonte - 0.4) texte = 'Clic droit : le dragon sort de sa main…';
  else if (!def.deja && t < tr.tMonte + 1.2) texte = '…et il saute dessus';
  else if (tr.tFonce != null && t >= tr.tFonce) texte = 'Clic droit dans le vide : le dragon fonce là où il regarde';
  else if (tr.tPrise != null && tr.tPrise >= 0 && t >= tr.tPrise - 1.6 && t < tr.tPrise + 1.8) texte = 'Clic droit sur quelqu\'un : la gueule l\'attrape';
  else if (def.victimeDansGueule) texte = 'Il vole avec un joueur dans la gueule…';
  else texte = 'Il dirige le dragon avec son regard (vitesse du vol du Vent 3)';
  legende.textContent = texte;
  if (!def.pose) {
    const ecoule = explose ? null : def.deja ? volDebut + (t - tr.t0) : t - tr.tMonte;
    if (ecoule != null && ecoule >= 0) vol = Math.min(30, ecoule);
  }
  minuteur.innerHTML = vol == null ? (explose ? 'Recharge : 20 s' : 'Clic droit : prêt') :
    `Vol : ${vol.toFixed(1)} s / 30 s<div class="jauge"><div class="plein" style="width:${(1 - vol / 30) * 100}%"></div></div>`;
  chrono.textContent = (pause ? '⏸ ' : '') + 't = ' + (t - tr.t0).toFixed(1) + ' s';

  // ---- la caméra
  if (vue !== 'libre') {
    let pos, vise;
    if (vue === 'cote') { pos = V(...def.cote[0]); vise = V(...def.cote[1]); }
    else {
      const centre = explose ? explose.p : T ? (L && (def.deja || t >= tr.tMonte) ? L.racine.position.clone() : T.o) : V(0, 2, 0);
      const f = explose ? camVise.clone().sub(camPos).setY(0).normalize() : T ? (def.deja || t >= tr.tMonte ? selle(tr, s).f : T.f).clone() : V(0, 0, 1);
      f.y *= 0.4; f.normalize();
      if (explose) { pos = camPos.clone(); vise = explose.p.clone(); }
      else if (!def.deja && t < tr.tMonte - 0.3) { pos = V(-5, 3.5, -7); vise = T ? T.o.clone().lerp(V(0, 1.5, 0), 0.5) : V(0, 2, 3); }
      else { pos = centre.clone().addScaledVector(f, -9).add(V(0, 4.2, 0)); vise = centre.clone().addScaledVector(f, 8).add(V(0, 0.5, 0)); }
    }
    const k = 1 - Math.exp(-dt * (vue === 'cote' ? 20 : 4));
    camPos.lerp(pos, k); camVise.lerp(vise, k);
    if (camPos.y < 1) camPos.y = 1;
    camera.position.copy(camPos); camera.lookAt(camVise);
  } else controles.update();
  composeur.render();

  // la scène est finie : on recommence
  if (!def.pose && t > tr.tFin + 5.5) preparer();
}

// ================================================================ les boutons
function boutons(id, liste, actif, choisir) {
  const el = document.getElementById(id);
  const bs = liste.map(([cle, nom]) => {
    const b = document.createElement('button'); b.textContent = nom;
    b.onclick = () => { bs.forEach((x) => x.classList.remove('actif')); b.classList.add('actif'); choisir(cle); };
    if (cle === actif) b.classList.add('actif');
    el.appendChild(b); return b;
  });
}
boutons('fruits', [['lave', 'Lave'], ['glace', 'Glace']], sorte, (c) => { sorte = c; document.body.classList.toggle('glace', c === 'glace'); const tt = t; preparer(); t = tt; });
boutons('scenes', [['tout', 'Tout (monter, gueule, foncer)'], ['monter', 'Monter'], ['gueule', 'La gueule'], ['foncer', 'Foncer'], ['fin30', 'Fin des 30 s'], ['pose', 'Pose']], 'tout', (c) => {
  if (c === 'monter' || c === 'gueule' || c === 'foncer') {
    nomScene = 'tout'; preparer();
    t = c === 'monter' ? 0 : c === 'gueule' ? tr.tPrise - 3.5 : tr.tFonce - 1.5;
  } else { nomScene = c; preparer(); }
  pause = false;
});
boutons('vues', [['suivre', 'Suivre'], ['cote', 'De loin'], ['libre', 'Libre']], vue, (c) => { vue = c; controles.enabled = c === 'libre'; if (c === 'libre') libre(); });
boutons('longueurs', [[24, '24 (avant)'], [30, '30'], [34, '34'], [40, '40']], LONGUEUR, (c) => { LONGUEUR = c; });
addEventListener('keydown', (e) => { if (e.code === 'Space') { pause = !pause; e.preventDefault(); } });
window.apercu = { aller: (x) => { t = tr.t0 + x; }, pause: (p) => { pause = p; }, camera, controles,
  vue: (pos, vise) => { vue = 'libre'; controles.enabled = true; camera.position.set(...pos); controles.target.set(...vise); },
  suivre: () => { vue = 'suivre'; controles.enabled = false; },
  rendre: (n = 30) => { for (let i = 0; i < n; i++) image(1 / 30); }, acteurs: ACTEURS, get t() { return t - tr.t0; }, get tr() { return tr; } };

preparer();
let avant = performance.now();
rendu.setAnimationLoop(() => {
  const maintenant = performance.now(), dt = Math.min(0.05, (maintenant - avant) / 1000);
  avant = maintenant;
  image(dt);
});
</script>
