<title>Isma Kebab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Plein écran, de nuit : la maquette au centre, l'enseigne et les zones à gauche, la carte des items à droite. Un seul thème, celui d'une rue à 23 h. */
:root {
  --nuit: #0d0f1a; --plaque: #171a2b; --bord: #2d3252; --bord2: #454b75;
  --jaune: #ffd21f; --rouge: #d9262c; --creme: #fff6e0; --gris: #aab0c8;
  --enseigne: "Bungee", "Arial Black", Impact, sans-serif; --texte: "Rubik", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--nuit); color: var(--creme); font-family: var(--texte); overflow: hidden; }
#scene { position: fixed; inset: 0; background: linear-gradient(#070915 0%, #151a37 55%, #3b2742 100%); touch-action: none; }
#scene canvas { display: block; }
.plaque { background: color-mix(in srgb, var(--plaque) 93%, transparent); border: 2px solid var(--bord); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--jaune); outline-offset: 2px; }

#panneau {
  position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(16px + env(safe-area-inset-top, 0px));
  width: min(300px, calc(100vw - 32px)); display: flex; flex-direction: column; max-height: calc(100% - 100px);
}
#bandeau { background: var(--jaune); color: var(--rouge); padding: 8px 12px 6px; flex: none; border-bottom: 3px solid var(--rouge); }
#bandeau h1 { font: 400 30px/1 var(--enseigne); margin: 0; letter-spacing: 1px; }
#bandeau p { margin: 2px 0 0; font: 700 12px var(--texte); letter-spacing: 1.5px; text-transform: uppercase; color: #8a1216; }
#panneau .corps { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
#vues { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex: none; }
#vues button { background: var(--plaque); border: 2px solid var(--bord2); padding: 6px; font-weight: 700; font-size: 13px; }
#vues button[aria-pressed="true"] { background: var(--jaune); border-color: var(--jaune); color: #2a1406; }
#resume { font-size: 13px; line-height: 1.45; color: var(--gris); margin: 0; }
#zones { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; min-height: 0; }
#zones button { text-align: left; background: #20243a; border: 0; padding: 7px 10px; font-size: 13px; line-height: 1.3; }
#zones button:hover { background: var(--bord2); }
#zones button.active { background: var(--rouge); }
#detail { font-size: 13px; line-height: 1.45; margin: 0; }
#detail:empty { display: none; }

#carte {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(16px + env(safe-area-inset-top, 0px));
  width: 330px; max-height: calc(100% - 100px); display: flex; flex-direction: column;
}
#carte header { padding: 9px 12px; border-bottom: 2px solid var(--bord); display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex: none; }
#carte h2 { margin: 0; font: 400 18px var(--enseigne); color: var(--jaune); letter-spacing: .5px; }
#carte header span { font-size: 12px; color: var(--gris); }
#fermer-carte { display: none; background: none; border: 0; font-size: 13px; color: var(--gris); padding: 2px 4px; }
#grille { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 10px 12px 6px; flex: none; }
#grille button { background: #20243a; border: 2px solid transparent; padding: 4px; aspect-ratio: 1; display: grid; place-items: center; }
#grille button:hover { border-color: var(--bord2); }
#grille button[aria-pressed="true"] { border-color: var(--jaune); background: #2b2f4a; }
#grille canvas { width: 100%; max-width: 44px; image-rendering: pixelated; }
#fiche { padding: 6px 12px 12px; overflow-y: auto; min-height: 0; display: grid; grid-template-columns: 76px 1fr; gap: 4px 12px; align-items: start; }
#fiche canvas { width: 76px; height: 76px; image-rendering: pixelated; background: #20243a; grid-row: span 3; }
#fiche h3 { margin: 0; font: 700 17px/1.2 var(--texte); }
#fiche .type { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--jaune); }
#fiche .prix { font: 400 15px var(--enseigne); color: var(--jaune); }
#fiche dl { grid-column: 1 / -1; margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 13px; line-height: 1.4; }
#fiche dt { color: var(--gris); }
#fiche dd { margin: 0; min-width: 0; }

#actions {
  position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px; max-width: calc(100vw - 32px); flex-wrap: wrap; justify-content: center;
}
#actions button { padding: 10px 16px; border: 2px solid var(--bord2); background: var(--plaque); font-weight: 700; font-size: 14px; white-space: nowrap; }
#entrer { background: var(--rouge) !important; border-color: #ff7a7e !important; }
#ouvrir-carte { display: none; }

#etiquettes { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.etiquette {
  position: absolute; left: 0; top: 0; pointer-events: auto; background: var(--nuit); border: 1px solid var(--jaune);
  color: var(--creme); padding: 3px 7px; font-size: 12px; white-space: nowrap; will-change: transform;
}

#viseur { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; pointer-events: none;
  background: linear-gradient(#fff,#fff) center/2px 14px no-repeat, linear-gradient(#fff,#fff) center/14px 2px no-repeat; mix-blend-mode: difference; }
#haut-visite {
  position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; pointer-events: none;
}
#ou { padding: 8px 12px; font: 400 16px var(--enseigne); color: var(--jaune); }
#aide { padding: 8px 12px; font-size: 12px; line-height: 1.5; color: var(--gris); max-width: 330px; }
#quitter { pointer-events: auto; padding: 9px 14px; background: var(--rouge); border: 2px solid #ff7a7e; font-weight: 700; font-size: 14px; white-space: nowrap; }
#message { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 9px 14px;
  font-size: 14px; max-width: calc(100vw - 32px); text-align: center; }
#message:empty { display: none; }
#tactile { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; grid-template-columns: 60px 60px; }
#tactile button { height: 56px; background: color-mix(in srgb, var(--plaque) 85%, transparent); border: 2px solid var(--bord2); font-weight: 700; font-size: 13px; touch-action: none; }
#erreur { position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 24px; text-align: center; font-size: 16px; background: var(--nuit); }

@media (max-width: 860px) {
  #carte { left: max(16px, env(safe-area-inset-left, 0px)); width: auto; top: auto; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); max-height: 62%; }
  #carte:not(.ouverte) { display: none; }
  #fermer-carte, #ouvrir-carte { display: inline-block !important; }
  #panneau { max-height: 44%; }
}
@media (max-width: 520px) {
  #bandeau h1 { font-size: 26px; }
  #actions button { padding: 9px 11px; font-size: 13px; }
  #aide { display: none; }
  .etiquette { font-size: 11px; }
}
</style>

<div id="scene" aria-label="Maquette 3D du kebab"></div>
<div id="etiquettes"></div>

<div id="ordinaire">
  <section id="panneau" class="plaque">
    <div id="bandeau"><h1>ISMA KEBAB</h1><p>Sur place ou à emporter</p></div>
    <div class="corps">
      <div id="vues" role="group" aria-label="Vue"></div>
      <p id="resume"></p>
      <nav id="zones" aria-label="Zones"></nav>
      <p id="detail"></p>
    </div>
  </section>
  <section id="carte" class="plaque" aria-label="Les items">
    <header><h2>La carte</h2><span>13 items</span><button id="fermer-carte" type="button">Fermer</button></header>
    <div id="grille"></div>
    <div id="fiche"></div>
  </section>
  <div id="actions">
    <button id="entrer" type="button">Entrer dans le kebab</button>
    <button id="noms" type="button" aria-pressed="true">Noms des zones</button>
    <button id="ouvrir-carte" type="button">La carte</button>
  </div>
</div>

<div id="visite" hidden>
  <div id="viseur"></div>
  <div id="haut-visite">
    <div id="ou" class="plaque"></div>
    <div id="aide" class="plaque">Z Q S D ou flèches pour marcher, glisse pour regarder, clic ou E sur la caisse, les broches ou le frigo.</div>
    <button id="quitter" type="button">Sortir</button>
  </div>
  <div id="message" class="plaque" role="status"></div>
  <div id="tactile" hidden>
    <button id="avant" type="button" aria-label="Avancer">Avancer</button>
    <button id="agir" type="button" aria-label="Actionner">Agir</button>
    <button id="arriere" type="button" aria-label="Reculer">Reculer</button>
  </div>
</div>
<div id="erreur" hidden>La 3D ne peut pas démarrer sur cet appareil.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
(function () {
const el = (id) => document.getElementById(id);
const alea = (s) => () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
const rgb = (a) => "rgb(" + a[0] + "," + a[1] + "," + a[2] + ")";

// ================================================================ les items, en 16 x 16 comme dans le jeu
function px(c, x, y, col) { c.fillStyle = col; c.fillRect(x, y, 1, 1); }
function rect(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x, y, w, h); }
function ell(c, cx, cy, rx, ry, f) {
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const u = (x + .5 - cx) / rx, v = (y + .5 - cy) / ry, d = u * u + v * v;
    if (d <= 1) { const k = f(x, y, d); if (k) px(c, x, y, k); }
  }
}
// le contour sombre autour de tout ce qui est dessiné, comme les items de Minecraft
function contour(c, col) {
  const d = c.getImageData(0, 0, 16, 16).data, plein = (x, y) => x >= 0 && y >= 0 && x < 16 && y < 16 && d[(y * 16 + x) * 4 + 3] > 0;
  const ajout = [];
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) if (!plein(x, y) && (plein(x - 1, y) || plein(x + 1, y) || plein(x, y - 1) || plein(x, y + 1))) ajout.push([x, y]);
  for (const [x, y] of ajout) px(c, x, y, col);
}
function grille(c, lignes, pal) { lignes.forEach((l, y) => [...l].forEach((ch, x) => { if (pal[ch]) px(c, x, y, rgb(pal[ch])); })); }
const VIANDE = ["#8a4a24", "#6e3818", "#a35d2e", "#7c4020"];
const piocher = (r, t) => t[Math.floor(r() * t.length)];

const DESSINS = {
  sandwich_kebab(c) {
    grille(c, [
      "",
      "......G...T",
      "....GTMGOMWTG",
      "...GMWMMGWMMTG",
      "..TMMWMMMMWMMMG",
      ".KBBBBBBBBBBBBK",
      ".KBsBBBBBsBBBBK",
      ".KBBBBsBBBBBsBK",
      ".KPPPPPPPPPPPPK",
      "..KPrPPrPPrPPK",
      "..KPPPPPPPPPPK",
      "...KPrPPrPPrK",
      "....KPPPPPPK",
      ".....KKKKKK",
    ], { G: [96, 176, 56], T: [214, 48, 40], O: [222, 190, 236], M: [140, 78, 40], W: [250, 250, 242], B: [226, 178, 104], s: [248, 230, 180], P: [244, 240, 232], r: [200, 40, 36], K: [70, 40, 20] });
    contour(c, "#46280f");
  },
  galette_kebab(c, r) {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const X = x + .5 - 8, Y = y + .5 - 8, a = (X - Y) / Math.SQRT2, p = (X + Y) / Math.SQRT2;
      if (Math.abs(p) > 2.4 || a < -6.6 || a > 6.2) continue;
      let col;
      if (a > 4.4) col = Math.abs(p) > 1.7 ? "#e8c98e" : piocher(r, ["#8c4e28", "#60b038", "#d63028", "#fafaf2", "#784020"]);
      else if (a < -.8) { const s = ((Math.floor(a * 1.2 + p * .8) % 2) + 2) % 2; col = Math.abs(p) > 1.6 ? "#8d939c" : s ? "#e3e7ec" : "#b9bfc8"; }
      else col = Math.abs(p) > 1.7 ? "#c99a5a" : (r() < .14 ? "#a8743a" : "#e7c587");
      px(c, x, y, col);
    }
    contour(c, "#46280f");
  },
  assiette_kebab(c, r) {
    ell(c, 8, 9.5, 7.6, 5.4, (x, y, d) => d > .72 ? "#c9ccd3" : "#f4f5f7");
    for (let i = 0; i < 10; i++) { const x = 3 + Math.floor(r() * 4), y = 7 + Math.floor(r() * 4); px(c, x, y, "#ffe27a"); px(c, x, y + 1, "#f2bd3c"); }
    ell(c, 10.6, 9.4, 3.1, 2.3, () => piocher(r, VIANDE));
    for (const [x, y, k] of [[6, 6, "#60b038"], [7, 6, "#4a9a2c"], [8, 5, "#60b038"], [9, 6, "#d63028"], [10, 6, "#60b038"], [8, 6, "#d63028"], [11, 6, "#de9ad8"]]) px(c, x, y, k);
    ell(c, 7.5, 12.4, 2, 1, () => "#fffdf2");
    contour(c, "#4d5260");
  },
  tacos(c, r) {
    for (let y = 4; y <= 11; y++) for (let x = 2; x <= 13; x++) {
      if ((y === 4 || y === 11) && (x === 2 || x === 13)) continue;
      let k = y === 11 ? "#c58f4a" : "#e3b66d";
      if (y > 4 && y < 10 && (x + y) % 4 === 0) k = "#a8662c";
      if (x >= 12 && y >= 5 && y <= 10) k = piocher(r, ["#ffd23f", "#ffd23f", "#8a4a24", "#f2bd3c"]);
      px(c, x, y, k);
    }
    for (const [x, y] of [[12, 12], [12, 13], [13, 12]]) px(c, x, y, "#ffd23f");
    contour(c, "#4a2a10");
  },
  broche(c) {
    rect(c, 7, 0, 2, 14, "#c3c9d2");
    for (let y = 2; y <= 12; y++) {
      const hw = 4.6 - (y - 2) * .2;
      for (let x = 0; x < 16; x++) {
        const dx = x + .5 - 8; if (Math.abs(dx) > hw) continue;
        let k = dx < -hw * .35 ? "#a65c2c" : dx > hw * .45 ? "#5e2e12" : "#8c4a22";
        if (y % 3 === 0 && dx > -hw * .6) k = "#74391a";
        px(c, x, y, k);
      }
    }
    rect(c, 3, 1, 10, 1, "#c3c9d2"); rect(c, 5, 13, 6, 1, "#c3c9d2"); rect(c, 4, 14, 8, 1, "#9aa1ab");
    contour(c, "#2e1a0c");
  },
  couteau_kebab(c) {
    for (let i = 0; i <= 8; i++) { px(c, 6 + i, 9 - i, "#eef1f5"); px(c, 6 + i, 10 - i, "#aeb5bf"); }
    for (const [x, y] of [[4, 10], [5, 10], [5, 11], [5, 9], [6, 11]]) px(c, x, y, "#5b616b");
    for (let i = 0; i <= 2; i++) { px(c, 2 + i, 13 - i, "#34343a"); px(c, 2 + i, 14 - i, "#1c1c20"); }
    contour(c, "#22252b");
  },
  viande_kebab(c, r) {
    for (const [cx, cy] of [[5, 12], [10, 12], [7.5, 10], [12, 10.5], [4.5, 9.5], [9, 8], [6.5, 7.5]]) {
      const base = piocher(r, VIANDE);
      ell(c, cx, cy, 2.8, 1.2, (x, y, d) => d > .5 ? "#5a2c12" : base);
    }
    contour(c, "#3a1d0c");
  },
  pain_turc(c, r) {
    ell(c, 8, 8.5, 7.2, 5.2, (x, y, d) => d > .7 ? "#b9792f" : d > .45 ? "#d9a04f" : (x + y) % 3 === 0 ? "#c98d42" : "#e8bb6c");
    for (let i = 0; i < 8; i++) px(c, 4 + Math.floor(r() * 8), 6 + Math.floor(r() * 5), "#fbf3dc");
    contour(c, "#5a3412");
  },
  sauce_blanche(c) { sauce(c, "#f3efe2", "#2f9a4a", "#2f9a4a"); },
  sauce_samourai(c) { sauce(c, "#e5732b", "#c8231f", "#ffe9a8"); },
  sauce_algerienne(c) { sauce(c, "#ea9d6d", "#2a7a3a", "#fff3e6"); },
  ayran(c) {
    for (let y = 5; y <= 14; y++) { const m = Math.floor((y - 5) / 5); for (let x = 4 + m; x <= 11 - m; x++) px(c, x, y, y >= 8 && y <= 10 ? (y === 9 && x % 2 ? "#e9eefb" : "#2d63c8") : y === 14 ? "#d9dce3" : "#f7f8fb"); }
    rect(c, 3, 4, 10, 1, "#c9ced6"); rect(c, 3, 3, 10, 1, "#eef1f5"); px(c, 13, 3, "#c9ced6"); px(c, 14, 2, "#c9ced6");
    contour(c, "#2c3446");
  },
  baklava(c) {
    const losange = (cx, cy, R) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const d = Math.abs(x + .5 - cx) + Math.abs(y + .5 - cy) * 1.3; if (d > R) continue; px(c, x, y, d > R - 1 ? "#9a5a1c" : y % 2 ? "#e2a64a" : "#c7832c"); } px(c, Math.floor(cx), Math.floor(cy) - 1, "#6cab3a"); px(c, Math.floor(cx) - 1, Math.floor(cy) - 1, "#8bc94e"); };
    losange(8, 6, 4.2); losange(4.8, 10.5, 4.4); losange(11.2, 10.5, 4.4);
    contour(c, "#5a3412");
  },
};
function sauce(c, corps, bouchon, etiquette) {
  rect(c, 7, 1, 2, 2, bouchon); rect(c, 6, 3, 4, 2, bouchon); rect(c, 5, 5, 6, 1, corps); rect(c, 4, 6, 8, 8, corps); rect(c, 5, 14, 6, 1, corps);
  rect(c, 4, 9, 8, 3, "#fbf7ea"); rect(c, 6, 10, 4, 1, etiquette); rect(c, 5, 6, 1, 3, "rgba(255,255,255,.45)"); rect(c, 5, 12, 1, 2, "rgba(255,255,255,.45)");
  contour(c, "#3a2418");
}
const ITEMS = [
  { id: "sandwich_kebab", nom: "Sandwich kebab", type: "Plat", prix: 20, effet: "8 de faim, Force I pendant 40 s", recette: "Pain turc + viande de kebab + une sauce", d: "Pain turc, viande, salade tomate oignon, emballé dans son papier." },
  { id: "galette_kebab", nom: "Galette kebab", type: "Plat", prix: 20, effet: "8 de faim, Vitesse I pendant 40 s", recette: "Galette + viande de kebab + une sauce", d: "Roulée dans l'alu, elle se mange en marchant." },
  { id: "assiette_kebab", nom: "Assiette kebab", type: "Plat", prix: 30, effet: "11 de faim, Absorption II pendant 45 s", recette: "Viande de kebab ×2 + frites + sauce blanche", d: "Viande, frites, salade, et la sauce à côté." },
  { id: "tacos", nom: "Tacos", type: "Plat", prix: 28, effet: "12 de faim, Résistance I pendant 45 s, puis Lenteur I 15 s", recette: "Galette + viande de kebab + frites + sauce fromagère", d: "Viande, frites et sauce fromagère dans la galette grillée. Ça cale." },
  { id: "broche", nom: "Broche", type: "Bloc", prix: 250, effet: "Tourne devant son grill. Un clic avec le couteau donne une viande de kebab", recette: "Vendue au comptoir", d: "La broche du kebab, à poser où tu veux. Elle se recharge toute seule." },
  { id: "couteau_kebab", nom: "Couteau à kebab", type: "Arme et outil", prix: 60, effet: "Frappe comme une épée en fer, découpe la broche", recette: "Vendu au comptoir", d: "La grande lame du kebabier." },
  { id: "viande_kebab", nom: "Viande de kebab", type: "Ingrédient", prix: 6, effet: "3 de faim si on la mange seule", recette: "Couteau à kebab sur une broche", d: "Découpée à la broche, encore chaude." },
  { id: "pain_turc", nom: "Pain turc", type: "Ingrédient", prix: 4, effet: "4 de faim", recette: "Blé ×3 + graines (four)", d: "Bien gonflé, sésame dessus." },
  { id: "sauce_blanche", nom: "Sauce blanche", type: "Sauce", prix: 3, effet: "Ajoute Régénération I 8 s au plat", recette: "Lait + œuf", d: "La classique." },
  { id: "sauce_samourai", nom: "Sauce samouraï", type: "Sauce", prix: 3, effet: "Le plat donne Force II au lieu de Force I", recette: "Sauce blanche + piment", d: "Ça pique un peu." },

  for (let i = 0; i < N; i++) { const l = TYPES[carte[i]].lum; if (l > lumiere[i]) { lumiere[i] = l; file[t++] = i; } }

// le scooter du livreur
const scooter = new THREE.Group(); scooter.position.set(18, 1, -4);
for (const [l, h, p, x, y, z, c] of [
  [1.7, .32, .5, 0, .35, 0, 0xd9262c], [.7, .5, .5, -.5, .6, 0, 0xd9262c], [.6, .12, .4, -.3, .9, 0, 0x1f2024], [.15, .7, .15, .75, .75, 0, 0x8e939b],

]) { const m = new THREE.Mesh(new THREE.BoxGeometry(l, h, p), couleur(c)); m.position.set(x, y, z); scooter.add(m); }
for (const x of [-.7, .75]) { const roue = new THREE.Mesh(new THREE.CylinderGeometry(.24, .24, .16, 14), couleur(0x111114)); roue.rotation.x = Math.PI / 2; roue.position.set(x, .24, 0); scooter.add(roue); }
const phare = new THREE.Mesh(new THREE.BoxGeometry(.06, .14, .2), couleur(0xfff3c4)); phare.position.set(.84, .95, 0); scooter.add(phare);

// la fumée de la cheminée

// ce qu'on peut actionner pendant la visite

cible(2.5, 2.3, 8.5, 1, .8, 1, ["« Bonsoir chef, sur place ou à emporter ? »", "« Salade tomate oignon ? Quelle sauce ? »", "« Blanche harissa ? Ça marche. 20 $. »"]);

cible(10.5, 2.3, 8.5, 2, .6, 1, ["Blanche, samouraï, algérienne, ketchup. Deux sauces maximum, chef."]);

// ================================================================ vues, zones, étiquettes
let vueCourante = VUES[0], zoneActive = null, modeVisite = false, nomsVisibles = true;

function volerVers(pos, cible, instant) { if (reduit || instant) { camera.position.copy(pos); controles.target.copy(cible); controles.update(); vol = null; return; } vol = { t: 0, p0: camera.position.clone(), c0: controles.target.clone(), p1: pos, c1: cible }; }
const lissage = (t) => t * t * (3 - 2 * t);
const boutonsVue = {};
for (const v of VUES) { const b = document.createElement("button"); b.type = "button"; b.textContent = v.nom; b.onclick = () => choisirVue(v); el("vues").appendChild(b); boutonsVue[v.id] = b; }

}
function choisirZone(z, bouton) {
  zoneActive = z; document.querySelectorAll("#zones button").forEach((b) => b.classList.remove("active")); if (bouton) bouton.classList.add("active");
  el("detail").textContent = z.d;
  const c = centre(z.b), l = Math.max(z.b[3] - z.b[0], z.b[5] - z.b[2]), d = Math.max(7, l * .9);

}
function majVisibles() {

  enseigne.m.visible = toit;
  menu.m.visible = modeVisite; // vu d'en haut, il cacherait les broches

}
const conteneur = el("etiquettes");
for (const z of ZONES) { const b = document.createElement("button"); b.type = "button"; b.className = "etiquette"; b.textContent = z.nom; b.hidden = true; b.onclick = () => choisirZone(z, z.bouton); conteneur.appendChild(b); z.etiquette = b; z.c = centre(z.b); z.c.y = z.b[1] + .5; }
const vecT = new THREE.Vector3();
function majEtiquettes() {
  const w = innerWidth, h = innerHeight;
  for (const z of ZONES) {
    const b = z.etiquette, voir = !modeVisite && nomsVisibles && z.v === vueCourante.id;
    if (!voir) { b.hidden = true; continue; }
    vecT.copy(z.c).project(camera);
    if (vecT.z > 1) { b.hidden = true; continue; }
    b.hidden = false; b.style.transform = "translate(" + Math.round((vecT.x * .5 + .5) * w - b.offsetWidth / 2) + "px," + Math.round((-vecT.y * .5 + .5) * h - b.offsetHeight / 2) + "px)";
  }
}
el("noms").onclick = () => { nomsVisibles = !nomsVisibles; el("noms").setAttribute("aria-pressed", nomsVisibles ? "true" : "false"); };

// ================================================================ cliquer
const rayon = new THREE.Raycaster(), souris = new THREE.Vector2();
let tempoMsg = 0;
function dire(t) { el("message").textContent = t; tempoMsg = 3; }
function actionner(m) { const u = m.userData; dire(u.textes[u.n % u.textes.length]); u.n++; }
let appui = null, regard = null;
rendu.domElement.addEventListener("pointerdown", (e) => { appui = { x: e.clientX, y: e.clientY }; if (modeVisite) { regard = { x: e.clientX, y: e.clientY }; rendu.domElement.setPointerCapture(e.pointerId); } });
rendu.domElement.addEventListener("pointermove", (e) => {
  if (modeVisite && regard) { joueur.lacet -= (e.clientX - regard.x) * .0048; joueur.tangage = Math.max(-1.5, Math.min(1.5, joueur.tangage - (e.clientY - regard.y) * .0048)); regard = { x: e.clientX, y: e.clientY }; }
});
rendu.domElement.addEventListener("pointerup", (e) => {
  regard = null; if (!appui) return; const d = Math.hypot(e.clientX - appui.x, e.clientY - appui.y); appui = null; if (d > 6) return;
  if (modeVisite) viser();
});
function cibleVisee() { rayon.setFromCamera(new THREE.Vector2(0, 0), camera); rayon.far = 4.5; return rayon.intersectObjects(CIBLES)[0]; }
function viser() { const t = cibleVisee(); if (t) actionner(t.object); }

// ================================================================ la visite à pied
const joueur = { x: 7.5, y: 1, z: -5, vy: 0, lacet: 0, tangage: 0, solAge: 0, oeil: 1.62 };
const touches = new Set();
function bloque(ix, iy, iz) { if (!dans(ix, iy, iz)) return false; return TYPES[carte[idx(ix, iy, iz)]].solide; }
function collision(x, y, z) {
  const r = .28;
  for (let ix = Math.floor(x - r); ix <= Math.floor(x + r); ix++) for (let iz = Math.floor(z - r); iz <= Math.floor(z + r); iz++) for (let iy = Math.floor(y + .01); iy <= Math.floor(y + 1.75); iy++) if (bloque(ix, iy, iz)) return true;
  return false;
}
function deplacer(dx, dz) {
  if (dx) { const nx = joueur.x + dx; if (!collision(nx, joueur.y, joueur.z)) joueur.x = nx; }
  if (dz) { const nz = joueur.z + dz; if (!collision(joueur.x, joueur.y, nz)) joueur.z = nz; }
}
const tactile = { avant: false, arriere: false };
function avancerVisite(dt) {
  const av = (touches.has("KeyW") || touches.has("ArrowUp") || tactile.avant ? 1 : 0) - (touches.has("KeyS") || touches.has("ArrowDown") || tactile.arriere ? 1 : 0);
  const co = (touches.has("KeyA") || touches.has("ArrowLeft") ? 1 : 0) - (touches.has("KeyD") || touches.has("ArrowRight") ? 1 : 0);
  const v = 4.6 * dt, s = Math.sin(joueur.lacet), c = Math.cos(joueur.lacet);
  let dx = s * av + c * co, dz = c * av - s * co; const l = Math.hypot(dx, dz); if (l > 1) { dx /= l; dz /= l; }
  deplacer(dx * v, 0); deplacer(0, dz * v);
  joueur.vy = Math.max(-22, joueur.vy - 26 * dt); const dy = joueur.vy * dt;
  if (!collision(joueur.x, joueur.y + dy, joueur.z)) joueur.y += dy;
  else { if (joueur.vy < 0) joueur.y = Math.floor(joueur.y + dy) + 1; joueur.vy = 0; }
  if (joueur.y < -5) rejoindre(7.5, 1, -5);
  const ch = Math.cos(joueur.tangage);
  camera.position.set(joueur.x, joueur.y + joueur.oeil, joueur.z);
  camera.lookAt(joueur.x + Math.sin(joueur.lacet) * ch, joueur.y + joueur.oeil + Math.sin(joueur.tangage), joueur.z + Math.cos(joueur.lacet) * ch);
  const dedans = joueur.x > 0 && joueur.x < 14 && joueur.z > 0 && joueur.z < 12;
  el("ou").textContent = !dedans ? "Dans la rue" : joueur.z > 8 ? "Derrière le comptoir" : "Dans le kebab";
  const t = cibleVisee();
  if (tempoMsg <= 0) el("message").textContent = t ? "E : regarder" : "";
}
function rejoindre(x, y, z) { joueur.x = x; joueur.y = y; joueur.z = z; joueur.vy = 0; }
function entrerVisite() {
  modeVisite = true; coupe = { min: 0, max: 99 }; construire(); majVisibles();
  el("ordinaire").hidden = true; el("visite").hidden = false; controles.enabled = false; rendu.domElement.style.cursor = "crosshair";
  rejoindre(7.5, 1, -5); joueur.lacet = 0; joueur.tangage = 0; camera.fov = 72; camera.updateProjectionMatrix();
  el("tactile").hidden = !matchMedia("(pointer: coarse)").matches; majEtiquettes();
}
function sortirVisite() {
  modeVisite = false; el("visite").hidden = true; el("ordinaire").hidden = false; controles.enabled = true; camera.fov = 50; camera.updateProjectionMatrix();
  touches.clear(); tactile.avant = tactile.arriere = false; rendu.domElement.style.cursor = "grab"; el("message").textContent = ""; choisirVue(vueCourante, true);
}
el("entrer").onclick = entrerVisite; el("quitter").onclick = sortirVisite;
addEventListener("keydown", (e) => { if (!modeVisite) return; if (e.code === "KeyE") viser(); else if (e.code === "Escape") sortirVisite(); else { touches.add(e.code); if (e.code.startsWith("Arrow")) e.preventDefault(); } });
addEventListener("keyup", (e) => touches.delete(e.code));
addEventListener("blur", () => touches.clear());
for (const k of ["avant", "arriere"]) { const b = el(k); b.addEventListener("pointerdown", (e) => { e.preventDefault(); tactile[k] = true; }); for (const ev of ["pointerup", "pointerleave", "pointercancel"]) b.addEventListener(ev, () => { tactile[k] = false; }); }
el("agir").onclick = viser;

// les polices arrivent après le premier dessin : on repeint l'enseigne et le menu
if (document.fonts && document.fonts.load) Promise.all([document.fonts.load("40px Bungee"), document.fonts.load("700 16px Rubik"), document.fonts.load("italic 700 16px Rubik")]).then(() => { for (const p of [enseigne, photo1, photo2, neon, menu, affiche]) p.peindre(); }, () => {});

// ================================================================ boucle
function taille() { const w = innerWidth, h = innerHeight; rendu.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", taille); taille();
choisirVue(VUES[0], true);
let avant = performance.now(), tNeon = 0, tTele = 0;
function boucle(t) {
  requestAnimationFrame(boucle);
  const dt = Math.min(.2, (t - avant) / 1000); avant = t;
  if (!reduit) for (const b of BROCHES) b.rotation.y += dt * .9;
  tNeon += dt; if (tNeon > (neonAllume ? 2.2 : .25)) { tNeon = 0; neonAllume = !neonAllume; neon.peindre(); }
  tTele += dt; tvT += dt; if (tTele > .12) { tTele = 0; tele.peindre(); }
  for (const s of FUMEE) {
    s.userData.age = (s.userData.age + dt) % 4; const a = s.userData.age / 4;
    s.position.set(9.5 + Math.sin(a * 5 + s.id) * .4 + a * 1.2, 8.6 + a * 5, 10.5 + a * .8);
    const k = .5 + a * 1.8; s.scale.set(k, k, 1); s.material.opacity = Math.sin(a * Math.PI) * .42;
  }
  if (tempoMsg > 0) { tempoMsg -= dt; if (tempoMsg <= 0) el("message").textContent = ""; }
  if (modeVisite) { for (let reste = dt; reste > 1e-4; reste -= .04) avancerVisite(Math.min(reste, .04)); }
  else {
    if (vol) { vol.t = Math.min(1, vol.t + dt / .9); const k = lissage(vol.t); camera.position.lerpVectors(vol.p0, vol.p1, k); controles.target.lerpVectors(vol.c0, vol.c1, k); if (vol.t >= 1) vol = null; }
    controles.update(); majEtiquettes();
  }
  rendu.render(scene, camera);
}
requestAnimationFrame(boucle);
})();
